  --torah:'ShlomoStam','AppSerif','Noto Serif Hebrew','Frank Ruhl Libre','SBL Hebrew','Times New Roman',serif;
  --vfont:var(--torah);
  --vsize:34px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220; --surface:#151D31; --ink:#EAF0FF; --muted:#9AA7C4; --line:#242F4A; --ctl:#7B89AB;
    --accent:#7C9BFF; --accent-soft:#1F2B4D; --tonal:#243360; --rec:#FF7B80; --accent-ink:#0C1220;
    --grad:linear-gradient(135deg,#7C9BFF 0%,#5AA9FF 100%);
    --done:#5FD3A5; --done-ink:#0C1220; --done-soft:#17352B; --done-grad:linear-gradient(135deg,#6FDDB1 0%,#4CC596 100%);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.55); --glow:0 10px 24px -8px rgba(var(--accent-rgb),.45); --accent-rgb:90,140,255;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#151D31; --ink:#EAF0FF; --muted:#9AA7C4; --line:#242F4A; --ctl:#7B89AB;
  --accent:#7C9BFF; --accent-soft:#1F2B4D; --tonal:#243360; --rec:#FF7B80; --accent-ink:#0C1220;
  --grad:linear-gradient(135deg,#7C9BFF 0%,#5AA9FF 100%);
  --done:#5FD3A5; --done-ink:#0C1220; --done-soft:#17352B; --done-grad:linear-gradient(135deg,#6FDDB1 0%,#4CC596 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.55); --glow:0 10px 24px -8px rgba(var(--accent-rgb),.45); --accent-rgb:90,140,255;
}
:root[data-font="print"]{--vfont:var(--heb)}
*,*::before,*::after{box-sizing:border-box}
@media (min-width:700px){#app{padding:0 28px;gap:14px}.verse{padding:0 6%}#plist .grid{grid-template-columns:repeat(8,1fr)}}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:var(--ui);font-feature-settings:"tnum" 1;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
}
[hidden]{display:none !important}
[data-ui="he"] #settings,[data-ui="he"] #unlock,[data-ui="he"] #recs,[data-ui="he"] .danger-zone{direction:rtl}
[data-ui="he"] .switch[aria-checked="true"]::after{transform:translateX(-22px)}
.num{direction:ltr;unicode-bidi:isolate}
.code-in{direction:ltr}
.seg[data-key="lang"]{direction:rtl}   /* עברית stays on the right, English on the left in both languages, so the highlight moves when you switch */
[data-ui="he"] .code-in::placeholder{direction:ltr}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;max-width:1024px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:10px}

/* shared look: white card, soft shadow, no hard borders */
.pk-btn,.icon-btn,.chips,.pcard,.stage-wrap,.back,.btn,.seg{box-shadow:var(--shadow)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 0}
.pk-btn{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;height:56px;padding:0 16px;
  background:var(--surface);border:0;border-radius:var(--r-md);text-align:start;
}
.pk-text{display:flex;flex-direction:row;align-items:baseline;gap:6px;min-width:0}
[data-ui="he"] .pk-btn:has(.pk-num.he){flex-direction:row-reverse}
[data-ui="he"] .pk-btn:has(.pk-num.he) .pk-text{direction:rtl}
.pk-sub{font-size:15px;font-weight:500;color:var(--muted);line-height:1.3;white-space:nowrap}
.pk-sub:not([hidden])+.pk-num.he:not(:empty)::before{content:none}
.pk-sub[data-dot]::after{content:' ·';}
.pk-num{font-weight:600;font-size:18px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-num.he{font-family:var(--ui);font-weight:600;font-size:19px;line-height:1.3}
.hb{unicode-bidi:isolate;font-family:var(--ui)}
.hdr-actions{display:flex;gap:8px;flex:none}
.icon-btn{
  width:56px;height:56px;display:grid;place-items:center;color:var(--accent);
  background:var(--surface);border:0;border-radius:var(--r-md);
}
.icon-btn svg{width:22px;height:22px}
.sheet-close{width:44px;height:44px;border-radius:14px;box-shadow:none;background:var(--bg);color:var(--muted)}

/* press feel: quick, light, springy */
.pk-btn,.icon-btn,.chip,.back,.primary,.btn,.endagain,.seg button,.cell,.prow{transition:transform .12s cubic-bezier(.2,.8,.3,1),box-shadow .12s,background-color .15s,color .15s,opacity .15s}
.pk-btn:active,.icon-btn:active,.back:active,.btn:active,.endagain:active,.cell:active,.prow:active{transform:scale(.97);box-shadow:var(--shadow-press)}
.primary:active{transform:scale(.975);box-shadow:0 4px 10px -6px rgba(var(--accent-rgb),.6)}
.chip:active,.seg button:active{transform:scale(.95)}

/* picker grid */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.cell{position:relative;min-height:60px;border-radius:var(--r-sm);background:var(--bg);padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0}
.cell .cn{font-family:var(--ui);font-size:18px;font-weight:600;line-height:1.3}
.cell .cd{font-size:12px;line-height:1.2;color:var(--muted)}
.cell.done .cd{color:inherit}
.cell.done{background:var(--done-soft);color:var(--done)}
.cell.current{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.quick{width:auto;min-width:58px;padding:0 8px;display:flex;flex-direction:column;gap:0;font-family:var(--ui);font-size:13.5px;font-weight:600;line-height:1.2}

/* aliyah strip: one segmented card, equal parts */
.chips{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:var(--r-md)}
.chips:empty{display:none}
.chip{
  position:relative;flex:1 1 0;min-width:0;height:40px;padding:0;border-radius:12px;
  background:transparent;border:0;font-size:16px;font-weight:600;color:var(--muted);
}
.chip.done{background:var(--done-soft);color:var(--done)}
.chip.done::after{content:"✓";position:absolute;top:2px;inset-inline-end:5px;font-size:9px;line-height:1}
.chip[aria-current="true"]{background:var(--grad);color:var(--accent-ink);box-shadow:0 6px 14px -6px rgba(var(--accent-rgb),.6)}

/* progress card: ring + reference */
.pcard{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--surface);border-radius:var(--r-lg)}
.pcard:has(#tally[hidden]){display:none}
.pcard:has(#ref:empty){justify-content:center}
.pcard .meta-row:has(#ref:empty){display:none}
#tally{flex:none}
.ring{position:relative;width:64px;height:64px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);stroke-width:7;overflow:visible}
.ring.rev svg{transform:scaleX(-1) rotate(-90deg)}
.ring .trk{stroke:var(--accent-soft)}
.ring .prg{stroke:url(#rg);stroke-dasharray:213.63;stroke-dashoffset:213.63}
.cnt{position:relative;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:17px;line-height:1;direction:ltr;white-space:nowrap}
.cnt .sl{display:block;width:20px;height:1.5px;margin:3px 0 2px;background:var(--line);font-size:0;border-radius:1px}
.cnt small{font-size:11.5px;font-weight:500;color:var(--muted)}
.cnt.long{font-size:15px}
.meta-row{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;font-size:13px;color:var(--muted)}
#ref{font-family:var(--ui);font-size:17px;font-weight:600;color:var(--ink)}
.meta-row svg,#pickerCount svg{width:13px;height:13px;stroke-width:2.75;margin-inline-end:4px;vertical-align:-2px}
#overall{white-space:nowrap;background:var(--done-soft);color:var(--done);font-weight:600;font-size:13px;padding:4px 10px;border-radius:999px}

/* stage: the verse sits in its own white card */
.stage-wrap{flex:1;min-height:0;display:flex;position:relative;overflow:hidden;background:var(--surface);border-radius:var(--r-lg)}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:20px 16px;overscroll-behavior:contain}
.verse{
  margin:auto;max-width:100%;text-align:center;direction:rtl;
  font-family:var(--vfont);font-size:var(--vsize);font-weight:400;line-height:2;
  text-wrap:balance;overflow-wrap:anywhere;
}
.status{margin:auto;text-align:center;color:var(--muted);font-size:16px;line-height:1.5;max-width:300px}
.status .btn{margin-top:14px}
.finish{margin:auto;text-align:center;padding:12px 8px}
.finish .heb{font-family:var(--vfont);font-size:34px;line-height:1.8;margin:0 0 8px}
.finish h2{margin:0 0 6px;font-size:22px;font-weight:600}
.finish p{margin:0 0 20px;color:var(--muted);font-size:16px}
.finish .stack{display:grid;gap:10px;max-width:320px;margin:0 auto}
.fin-mark{width:88px;height:88px;margin:0 auto 14px;border-radius:50%;background:var(--done-grad);color:var(--done-ink);display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(30,158,115,.6)}
.fin-mark svg{width:46px;height:46px;stroke-width:2.6}
.fin-count{font-size:34px;font-weight:700;margin:0 0 6px;direction:ltr}
.finish.glob .heb{font-size:28px;margin:0 0 22px;color:var(--muted)}
.finish.glob .stack{grid-template-columns:1fr 1fr}
.finish.glob .stack .btn{flex-direction:column;gap:6px;min-height:78px;font-size:16px}
.finish.glob .stack .btn svg{width:26px;height:26px}

/* text display control */
.modebar .seg{padding:4px;grid-auto-flow:row;grid-template-columns:1.5fr 1fr 1fr}
.modebar .seg button{white-space:nowrap;padding:0 4px;font-size:15px;min-height:36px;position:relative}
.modebar .seg button::before{content:'';position:absolute;inset:-4px 0}

.kq{position:relative;display:inline-block;margin:.08em 0 .8em;padding:.12em .24em;line-height:1.55;background:var(--accent-soft);border-radius:14px;cursor:pointer;touch-action:manipulation;transition:background-color .15s}
.kq::after{content:attr(data-lbl);position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font:600 12px/1 var(--ui);letter-spacing:.01em;color:var(--muted);white-space:nowrap;direction:ltr;unicode-bidi:plaintext;pointer-events:none}
.kq:active{background:var(--tonal)}
.recbtn{flex:none;min-width:44px;height:44px;padding:0 13px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.recbtn .recico{display:grid;place-items:center;line-height:0}
.recbtn svg{width:21px;height:21px;display:block}
.recbtn .rectime:empty{display:none}
.recbtn[data-mode="rec"]{background:rgba(229,72,77,.13);color:var(--rec)}
.recbtn[data-mode="play"],.recbtn[data-mode="paused"]{background:var(--tonal);color:var(--accent)}
.recbtn:active{transform:scale(.95)}
#recsBtn.live{color:var(--rec)}
.rec{display:flex;direction:rtl;align-items:center;gap:10px;padding:10px 12px 10px 10px;border-radius:var(--r-md);background:var(--bg);margin-bottom:8px}
.recplay{width:44px;height:44px;flex:none;border-radius:14px;border:0;background:var(--tonal);color:var(--accent);display:grid;place-items:center}
.recplay svg{width:22px;height:22px}
.recplay:active,.recact:active{transform:scale(.93)}
.rectxt{flex:1;min-width:0}
.rect1{font-weight:600;font-size:16px;line-height:1.35}
.rect1 bdi{display:block}
.rect1 bdi:nth-child(2){font-size:14px;font-weight:500;color:var(--ink)}
.rect2{font-size:13px;color:var(--muted);margin-top:2px;direction:ltr;text-align:right}
.recact{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center}
.recact svg{width:20px;height:20px}
.recconfirm{display:none;flex:1;align-items:center;gap:8px;min-width:0}
.recq{flex:1;min-width:0;font-weight:600;font-size:15px}
.recconfirm button{height:44px;padding:0 16px;border:0;border-radius:14px;font-weight:600;font-size:15px;background:var(--surface);color:var(--ink)}
.recconfirm .recyes{background:#C2362E;color:#fff}
.recconfirm button:active{transform:scale(.96)}
.rec.confirm .recplay,.rec.confirm .rectxt,.rec.confirm .recact{display:none}
.rec.confirm .recconfirm{display:flex}
[data-ui="en"] .recconfirm{direction:ltr}
.rec.removing{opacity:0;transform:scale(.97);transition:opacity .2s,transform .2s}
.toast.txt #toastMsg{position:static;width:auto;height:auto;margin:0;padding:0;overflow:visible;clip:auto;white-space:normal;font-size:15px;line-height:1.35;max-width:300px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.practice .prow{grid-template-columns:1fr auto}
.practice .p-mark{display:none}
/* scroll control */
.reader{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 0 16px}
.back{height:44px;min-height:44px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;background:var(--tonal);border:0;color:var(--accent);box-shadow:none}
.back:disabled{opacity:.45;box-shadow:none;cursor:default}
.navdown{display:grid;grid-template-columns:1fr;gap:12px}
.navdown.ending{grid-template-columns:1fr 2fr}
.primary{height:64px;min-height:64px;border-radius:20px;font-size:18px}
.endagain{height:64px;min-height:64px;border-radius:20px;font-size:16px;font-weight:600;background:var(--surface);border:0;color:var(--accent);box-shadow:var(--shadow)}
.navdown.ending .primary{padding:6px;font-size:16px}
.navdown.ending .primary svg{width:24px;height:24px}
@media (max-height:700px){
  #app{gap:8px}
  header{padding-top:8px}
  .ring{width:56px;height:56px}.cnt{font-size:15px}.cnt small{font-size:11px}.pcard{padding:6px 14px}
  .back{height:42px;min-height:42px}
  .primary,.endagain{height:56px;min-height:56px}
  .reader{gap:8px;padding-bottom:10px}
}
.primary .row1{display:flex;align-items:center;gap:8px}
.back svg,.primary>svg{width:26px;height:26px;stroke-width:2.5}
.primary .row1 svg{width:22px;height:22px;stroke-width:2.25}
.primary{
  background:var(--grad);color:var(--accent-ink);border:0;font-weight:600;box-shadow:var(--glow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;
}
.primary:disabled{opacity:.5;cursor:default;box-shadow:none}
.primary .sub{font-size:13px;font-weight:400;opacity:.92}
.hebsub{font-family:var(--ui);font-size:15px}
.primary.final{background:var(--done-grad);box-shadow:0 10px 24px -8px rgba(30,158,115,.55)}
.btn{min-height:52px;border-radius:var(--r-md);border:0;background:var(--surface);font-size:16px;font-weight:600;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;color:var(--accent)}
.btn.solid{background:var(--grad);color:var(--accent-ink);box-shadow:var(--glow)}
.btn.danger{color:#C2362E;background:transparent;box-shadow:none;border:1.5px solid currentColor}
:root[data-theme="dark"] .btn.danger{color:#F2A8A2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.danger{color:#F2A8A2}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(14,22,44,.45);z-index:10;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;margin:0 auto;max-width:720px;max-height:90%;
  display:flex;flex-direction:column;background:var(--surface);color:var(--ink);
  border-radius:28px 28px 0 0;box-shadow:0 -12px 48px rgba(14,22,44,.25);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.sheet .btn,.sheet .seg{box-shadow:none}
.sheet .btn.solid{box-shadow:var(--glow)}
.sheet .btn:not(.solid):not(.danger){background:var(--bg)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:20px;font-weight:700}
.sheet-body{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:2px 12px}
.sheet-body,#stage{scrollbar-width:thin;scrollbar-color:var(--line) transparent}   /* a slim scrollbar everywhere, kept clear of the content by the sheet's side padding */
.sheet-body::-webkit-scrollbar,#stage::-webkit-scrollbar{width:6px}
.sheet-body::-webkit-scrollbar-thumb,#stage::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
#picker .sheet-body{padding:8px 12px 6px}
.head-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.sheet-head .sheet-sub{margin:0}
.week-row{display:flex;gap:8px;align-items:stretch;margin:0 0 8px;flex:none}
.week-row #thisWeek{flex:1;min-width:0;margin:0}
.seg.where{direction:rtl;flex:none;display:flex;flex-direction:column;gap:3px;padding:3px;border-radius:var(--r-md);background:var(--bg);box-shadow:none;width:76px}
.seg.where button{flex:1;min-height:0;padding:0 8px;font-size:13.5px;font-weight:600;white-space:nowrap;border-radius:12px;color:var(--muted);background:transparent;box-shadow:none}
.seg.where button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(22,32,58,.14)}
.sheet-foot{flex:none;padding-top:12px;margin-top:4px;border-top:1px solid var(--line)}
.sheet-foot .danger-zone{margin:0;padding:0;border:0}
.sheet-foot .btn.danger{min-height:48px}
.sheet-foot .selbar{padding-top:0}
.sheet-sub{margin:12px 0 0;font-size:14px;color:var(--muted)}
.sheet-sub.after{margin:4px 0 4px}
.code-in{width:100%;min-height:56px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 clamp(15px,5.3vw,21px) ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;text-align:center;text-transform:uppercase;padding:0 12px}
.code-in[aria-invalid="true"]{border-color:#C2362E}
:root[data-theme="dark"] .code-in[aria-invalid="true"]{border-color:#F2A8A2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .code-in[aria-invalid="true"]{border-color:#F2A8A2}}
.code-in:focus{outline:2px solid var(--accent);outline-offset:1px}
.msg{min-height:22px;margin:10px 0 14px;font-size:14px;color:var(--muted);text-align:center}
.msg.err{color:#C2362E}
:root[data-theme="dark"] .msg.err{color:#F2A8A2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.err{color:#F2A8A2}}
.lic .btn{margin-top:10px}
.week{flex-direction:column;gap:2px;min-height:60px;padding:8px 16px}
.week .w-sub{font-size:13px;font-weight:400;opacity:.92}
.sefer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 2px 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sefer .s-en{font-size:16px;font-weight:600}
.sefer .s-he{font-family:var(--ui);font-weight:600;font-size:19px;color:var(--muted)}
.sefer:has(.s-he:only-child){justify-content:flex-end}
.plist{display:grid;gap:8px}
.prow{
  display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;
  width:100%;min-height:60px;padding:8px 14px 8px 12px;padding-inline:12px 14px;text-align:start;
  background:var(--bg);border:0;border-radius:var(--r-md);
}
.p-mark{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;line-height:1}
.prow.done{background:var(--done-soft)}
.prow.done .p-mark{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.prow.done .p-mark::after{content:"✓"}
.prow.current{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.p-names{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.p-en{font-size:17px;font-weight:600}
.p-he{font-family:var(--ui);font-weight:500;font-size:18px;color:var(--muted)}
.p-names:has(.p-he:only-child) .p-he{font-size:21px;font-weight:600;color:var(--ink)}
.p-prog{font-size:14px;color:var(--muted);white-space:nowrap}
.selbtn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:14px;background:var(--bg);color:var(--accent)}
.selbtn svg{width:22px;height:22px}
.selbtn:active{transform:scale(.94)}
.selbar{display:flex;gap:10px;padding-top:12px}
.selact{flex:1;height:56px;border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:17px;background:var(--bg);color:var(--ink)}
.selact.ok{flex:1.4;background:var(--grad);color:var(--accent-ink);box-shadow:var(--glow)}
.selact:disabled{opacity:.45;box-shadow:none}
.selact:active{transform:scale(.97)}
.selcount{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:rgba(255,255,255,.28);font-size:14px;font-weight:700;line-height:1}
.selcount:empty{display:none}
.cell .ck{display:none}
.editing .unmark{display:none}
.editing .cell .cd{display:none}
.editing .cell .ck{display:grid;place-items:center;height:17px;color:var(--ctl);opacity:.4}
.editing .cell .ck svg{width:17px;height:17px;stroke-width:2.6}
.editing .cell.done .ck{color:var(--done);opacity:1}
.editing .cell.current:not(.chg){box-shadow:none}
.editing .cell.current:not(.done){background:var(--bg)}
.editing .cell.current.done{background:var(--done-soft)}
.editing .cell.chg{box-shadow:0 0 0 2px var(--accent)}
.editing .cell.chg .ck{color:var(--accent);opacity:1}
.lk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:0 1px 3px rgba(22,32,58,.1)}
.lk svg{width:17px;height:17px;stroke-width:2.2}
.lk.open{background:var(--done-soft);color:var(--done);box-shadow:none}
.unmark{position:absolute;top:-7px;inset-inline-start:-7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--done);box-shadow:0 1px 3px rgba(22,32,58,.18);cursor:pointer}
.unmark svg{width:12px;height:12px;stroke-width:3}
.unmark::before{content:'';position:absolute;inset:-9px}
.unmark:active{transform:scale(.9)}
.prow .unmark{position:relative;top:auto;inset-inline-start:auto;width:34px;height:34px}
.prow .unmark svg{width:16px;height:16px}
.prow{position:relative}
.prow.locked{background:var(--bg)}
.prow.locked .p-names{opacity:.7}
.he-ui .prow{direction:rtl}
.practice.he-ui .prow{grid-template-columns:1fr auto}
.prow.done .p-prog{color:var(--done)}

.row{margin:0 0 20px}
.row>label,.row>.lbl{display:block;font-size:15px;font-weight:600;margin-bottom:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);padding:4px;border-radius:var(--r-md);border:0}
.sheet .seg{background:var(--bg)}
.seg button{min-height:44px;border:0;background:transparent;border-radius:12px;font-size:15px;font-weight:500;color:var(--muted);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--accent-ink);font-weight:600;box-shadow:0 6px 14px -6px rgba(var(--accent-rgb),.6)}
input[type=range]{width:100%;height:32px;accent-color:var(--accent);margin:0}
.preview{text-align:center;direction:rtl;font-family:var(--vfont);font-size:var(--vsize);line-height:1.9;margin:6px 0 0;overflow:hidden;white-space:nowrap}
.swatches{display:flex;gap:16px;align-items:center;padding:7px 8px}
.swatches button{width:44px;height:44px;border-radius:50%;border:0;padding:0;background:var(--sw);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.swatches button::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2.5px solid transparent;transition:border-color .15s}
.swatches button[aria-pressed="true"]::after{border-color:var(--sw)}
.swatches button[aria-pressed="true"]::before{content:'';position:absolute;left:50%;top:50%;width:12px;height:6px;margin:-5px 0 0 -6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg)}
.swatches button:active{transform:scale(.92)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch-row .lbl{margin:0;font-size:15px;font-weight:600}
.switch-row small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.switch::before{content:'';position:absolute;inset:-7px 0}
.switch{position:relative;width:54px;height:32px;border-radius:16px;border:0;background:var(--line);flex:none;padding:0}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--grad)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.danger-zone{margin-top:8px;padding-top:20px;border-top:1px solid var(--line)}
.danger-zone .note{margin:0 0 12px;font-size:14px;line-height:1.45;color:var(--muted)}
.danger-zone .btn{line-height:1.3;padding:12px 16px;text-align:center}
.about{font-size:13px;color:var(--muted);line-height:1.55;margin:16px 0 4px;direction:ltr;text-align:left}
.about-font{display:block;margin-top:8px;text-align:start}
.about.build{margin-top:4px;font-size:12px;opacity:.8}
.about strong{color:var(--ink);font-weight:600}

/* toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);width:max-content;z-index:9;
  bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:4px 16px;min-height:48px;border-radius:var(--r-md);
  display:flex;align-items:center;gap:10px;font-size:15px;max-width:calc(100% - 32px);
  box-shadow:0 10px 30px rgba(14,22,44,.3);
}
.is-finish .toast{bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.toast .t-ico svg{width:24px;height:24px}
.toast button{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:inherit;min-height:44px;padding:0 14px;font-weight:600;font-size:15px;border-radius:12px}
.toast button svg{width:20px;height:20px}
@media (prefers-reduced-motion: no-preference){
  .recbtn[data-mode="rec"] .recico{animation:recpulse 1.1s ease-in-out infinite}
  @keyframes recpulse{50%{opacity:.45}}
    .ring .prg{transition:stroke-dashoffset .5s cubic-bezier(.3,.7,.2,1)}
  .ring.grow .prg{transition:stroke-dashoffset .7s cubic-bezier(.25,.6,.2,1)}
      .verse.enter{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{animation:up .24s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
  .switch::after{transition:transform .18s cubic-bezier(.3,.7,.2,1)}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="pk-btn" id="openPicker" aria-haspopup="dialog" aria-label="Choose a parsha">
      <span class="pk-text">
        <span class="pk-sub" id="pkSub" lang="he" hidden></span>
        <span class="pk-num" id="pkNum"></span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="hdr-actions">
      <button class="icon-btn quick" id="quickBtn" hidden lang="he"></button>
      <button class="icon-btn" id="recsBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4"/><path d="M8 6v12"/><path d="M12 3v18"/><path d="M16 7v10"/><path d="M20 10v4"/></svg></button>
      <button class="icon-btn" id="randomBtn" aria-label="Random aliyah in this parsha">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      </button>
      <button class="icon-btn" id="openSettings" aria-haspopup="dialog" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </button>
    </div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Aliyos"></div>

  <div class="pcard" id="pcard">
    <div id="tally">
      <div class="ring" role="progressbar" aria-label="Progress through this aliyah" aria-valuemin="0" aria-valuemax="100" id="bar">
        <svg viewBox="0 0 80 80" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ring-a)"/><stop offset="1" style="stop-color:var(--ring-b)"/></linearGradient></defs><circle class="trk" cx="40" cy="40" r="34.5"/><circle class="prg" id="barFill" cx="40" cy="40" r="34.5"/></svg>
        <span class="cnt" id="verseTxt"></span>
      </div>
    </div>
    <button class="recbtn" id="recBtn" hidden data-mode="idle"><span class="recico"></span><span class="rectime" id="recTime"></span></button>
    <div class="meta-row"><span id="ref" lang="he" dir="rtl"></span><span id="overall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span class="num" id="ovTxt"></span></span></div>
  </div>

  <section class="reader" id="reader">
  <button class="back" id="back" data-ta="prevAria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
  <div class="stage-wrap" id="stageWrap">
  <main id="stage">
    <p class="verse" id="verse" lang="he" dir="rtl"></p>
    <div class="status" id="status" hidden>
      <div id="statusTxt"></div>
      <button class="btn" id="retry" hidden data-i="tryAgain"></button>
    </div>
    <div class="finish" id="finish" hidden>
      <div class="fin-mark" id="finMark" hidden aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <div class="fin-count" id="finCount" hidden></div>
      <p class="heb" id="finHeb" lang="he" dir="rtl"></p>
      <h2 id="finTitle"></h2>
      <p id="finSub"></p>
      <div class="stack">
        <button class="btn solid" id="nextParsha"></button>
        <button class="btn" id="chooseParsha">Choose a parsha</button>
        <button class="btn" id="again">Practice this parsha again</button>
      </div>
    </div>
  </main>
  </div>
  <div class="modebar" id="modebar">
    <div class="seg" role="group" aria-label="Text on screen" data-ta="modeGroupAria" data-key="mode">
      <button data-v="full" data-t="modeFull" data-ta="modeFullAria">Full</button>
      <button data-v="nikud" data-t="modeNikud" data-ta="modeNikudAria">Nikud</button>
      <button data-v="plain" data-t="modePlain" data-ta="modePlainAria">Plain</button>
    </div>
  </div>
  <div class="navdown" id="navdown">
    <button class="endagain" id="endAgain" hidden data-ta="endAgainAria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="primary" id="next"></button>
  </div>
  </section>


</div>

<div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="toast" id="toast" role="status" hidden><span class="t-ico" id="toastIco" aria-hidden="true"></span><span class="sr-only" id="toastMsg"></span></div>
<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="picker" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head">
    <p class="sheet-sub after" id="pickerCount"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span class="num" id="pcTxt"></span></p>
    <div class="head-actions">
      <button class="selbtn" id="selToggle" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 6.5 2 2 3.5-4"/><path d="m3.5 14.5 2 2 3.5-4"/><path d="M13 7h8"/><path d="M13 15h8"/></svg></button>
      <button class="icon-btn sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </div>
  <div class="week-row" id="weekRow" hidden>
    <button class="btn solid week" id="thisWeek" hidden>
      <span id="wMain"></span>
      <span class="w-sub" id="wSub"></span>
    </button>
    <div class="seg where" role="group" data-key="where" data-ta="whereAria" id="whereSeg">
      <button data-v="il" data-i="israel"></button>
      <button data-v="dia" data-i="diaspora"></button>
    </div>
  </div>
  <div class="sheet-body">
    <div id="plist"></div>
  </div>
  <div class="sheet-foot" id="pfoot">
    <div class="danger-zone">
      <p class="note sr-only" id="resetNote"></p>
      <button class="btn danger" id="reset" aria-describedby="resetNote">Reset progress</button>
    </div>
    <div class="selbar" id="selbar" hidden>
      <button class="selact" id="selCancel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span data-i="selCancel"></span></button>
      <button class="selact ok" id="selApply" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span data-i="selApply"></span><span class="selcount" id="selN"></span></button>
    </div>
  </div>
</section>

<section class="sheet" id="recs" role="dialog" aria-modal="true" aria-labelledby="recsTitle" hidden>
  <div class="sheet-head">
    <h2 id="recsTitle" data-i="recsTitle"></h2>
    <button class="icon-btn sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="sheet-body">
    <div id="recList"></div>
    <p class="sheet-sub" id="recEmpty" data-i="recEmpty" hidden></p>
  </div>
</section>

<section class="sheet" id="unlock" role="dialog" aria-modal="true" aria-labelledby="unlockTitle" hidden>
  <div class="sheet-head">
    <h2 id="unlockTitle"></h2>
    <button class="icon-btn sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="sheet-body">
    <p class="sheet-sub" id="unlockWhy" style="margin:0 0 16px"></p>
    <div class="row"><label for="code" data-i="unlockCode"></label>
      <input class="code-in" id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" aria-describedby="unlockMsg"></div>
    <p class="msg" id="unlockMsg" role="status"></p>
    <button class="btn solid" id="unlockBtn" data-i="unlockBtn"></button>
    <p class="sheet-sub" data-i="noCode"></p>
  </div>
</section>

<section class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="sheet-head">
    <h2 id="settingsTitle" data-i="settings"></h2>
    <button class="icon-btn sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="sheet-body">
    <div class="row">
      <div class="lbl" id="lblLang" data-i="language"></div>
      <div class="seg" role="group" aria-labelledby="lblLang" data-key="lang">
        <button data-v="he" lang="he">עברית</button>
        <button data-v="en" lang="en">English</button>
      </div>
    </div>
    <div class="row" id="fontRow">
      <div class="lbl" id="lblFont" data-i="font"></div>
      <div class="seg" role="group" aria-labelledby="lblFont" data-key="font">
        <button data-v="torah"></button>
        <button data-v="print" data-i="fontRegular"></button>
      </div>
    </div>
    <div class="row">
      <label for="size" data-i="textSize"></label>
      <input type="range" id="size" min="26" max="64" step="2">
      <p class="preview" id="preview" lang="he" dir="rtl"></p>
    </div>
    <div class="row">
      <div class="lbl" id="lblTheme" data-i="theme"></div>
      <div class="seg" role="group" aria-labelledby="lblTheme" data-key="theme">
        <button data-v="auto" data-i="auto"></button>
        <button data-v="light" data-i="light"></button>
        <button data-v="dark" data-i="dark"></button>
      </div>
    </div>
    <div class="row">
      <div class="lbl" id="lblColor" data-i="color"></div>
      <div class="swatches" id="swatches" role="group" aria-labelledby="lblColor">
        <button data-v="blue" data-ta-i="cBlue" style="--sw:#4A6CF7"></button>
        <button data-v="purple" data-ta-i="cPurple" style="--sw:#7255EB"></button>
        <button data-v="green" data-ta-i="cGreen" style="--sw:#1F9361"></button>
        <button data-v="rose" data-ta-i="cRose" style="--sw:#D9466F"></button>
      </div>
    </div>
    <div class="row switch-row" id="kqRow" hidden>
      <span class="lbl" id="lblKq"><span data-i="kqLabel"></span><small data-i="kqSub"></small></span>
      <button class="switch" id="kqSwitch" role="switch" aria-checked="false" aria-labelledby="lblKq"></button>
    </div>
    <div class="row switch-row">
      <span class="lbl" id="lblWake"><span data-i="wake"></span><small data-i="wakeSub"></small></span>
      <button class="switch" id="wake" role="switch" aria-checked="true" aria-labelledby="lblWake"></button>
    </div>
    <div class="row lic">
      <div class="lbl" data-i="access"></div>
      <p class="note" id="licTxt"></p>
      <button class="btn" id="licBtn" data-i="enterCode"></button>
    </div>
    <p class="about" id="about"></p>
    <p class="about build" id="buildTxt">Build 2026-11-26 10:39 UTC</p>

<script id="app-data">window.APP_DATA={"p1":[[1,1,"אַ֥שְׁרֵי־הָאִ֗ישׁ אֲשֶׁ֤ר ׀ לֹ֥א הָלַךְ֮ בַּעֲצַ֪ת רְשָׁ֫עִ֥ים וּבְדֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּבְמוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָׁב׃"],[1,2,"כִּ֤י אִ֥ם בְּתוֹרַ֥ת יְהוָ֗ה חֶ֫פְצ֥וֹ וּבְתוֹרָת֥וֹ יֶהְגֶּ֗ה יוֹמָ֥ם וָלָיְלָה׃"],[1,3,"וְהָיָ֗ה כְּעֵץ֮ שָׁת֪וּל עַל־פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨וֹ ׀ יִתֵּ֬ן בְּעִתּ֗וֹ וְעָלֵ֥הוּ לֹא־יִבּ֑וֹל וְכֹ֖ל אֲשֶׁר־יַעֲשֶׂ֣ה יַצְלִיחַ׃"],[1,4,"לֹא־כֵ֥ן הָרְשָׁעִ֑ים כִּ֥י אִם־כַּ֝מֹּ֗ץ אֲשֶׁר־תִּדְּפֶ֥נּוּ רוּחַ׃"],[1,5,"עַל־כֵּ֤ן ׀ לֹא־יָקֻ֣מוּ רְ֭שָׁעִים בַּמִּשְׁפָּ֑ט וְ֝חַטָּאִ֗ים בַּעֲדַ֥ת צַדִּיקִים׃"],[1,6,"כִּי־יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְדֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵד׃"]],"p2":[[2,1,"לָ֭מָּה רָגְשׁ֣וּ גוֹיִ֑ם וּ֝לְאֻמִּ֗ים יֶהְגּוּ־רִיק׃"],[2,2,"יִ֥תְיַצְּב֨וּ ׀ מַלְכֵי־אֶ֗רֶץ וְרוֹזְנִ֥ים נוֹסְדוּ־יָ֑חַד עַל־יְ֝הוָה וְעַל־מְשִׁיחוֹ׃"],[2,3,"נְ֭נַתְּקָה אֶת־מוֹסְרוֹתֵ֑ימוֹ וְנַשְׁלִ֖יכָה מִמֶּ֣נּוּ עֲבֹתֵימוֹ׃"],[2,4,"יוֹשֵׁ֣ב בַּשָּׁמַ֣יִם יִשְׂחָ֑ק אֲ֝דֹנָ֗י יִלְעַג־לָמוֹ׃"],[2,5,"אָ֤ז יְדַבֵּ֣ר אֵלֵ֣ימוֹ בְאַפּ֑וֹ וּבַחֲרוֹנ֥וֹ יְבַהֲלֵמוֹ׃"],[2,6,"וַ֭אֲנִי נָסַ֣כְתִּי מַלְכִּ֑י עַל־צִ֝יּ֗וֹן הַר־קָדְשִׁי׃"],[2,7,"אֲסַפְּרָ֗ה אֶ֫ל חֹ֥ק יְהוָ֗ה אָמַ֘ר אֵלַ֥י בְּנִ֥י אַ֑תָּה אֲ֝נִ֗י הַיּ֥וֹם יְלִדְתִּיךָ׃"],[2,8,"שְׁאַ֤ל מִמֶּ֗נִּי וְאֶתְּנָ֣ה ג֭וֹיִם נַחֲלָתֶ֑ךָ וַ֝אֲחֻזָּתְךָ֗ אַפְסֵי־אָרֶץ׃"],[2,9,"תְּ֭רֹעֵם בְּשֵׁ֣בֶט בַּרְזֶ֑ל כִּכְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵם׃"],[2,10,"וְ֭עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָרֶץ׃"],[2,11,"עִבְד֣וּ אֶת־יְהוָ֣ה בְּיִרְאָ֑ה וְ֝גִ֗ילוּ בִּרְעָדָה׃"],[2,12,"נַשְּׁקוּ־בַ֡ר פֶּן־יֶאֱנַ֤ף ׀ וְתֹ֬אבְדוּ דֶ֗רֶךְ כִּי־יִבְעַ֣ר כִּמְעַ֣ט אַפּ֑וֹ אַ֝שְׁרֵ֗י כָּל־ח֥וֹסֵי בוֹ׃"]],"p3":[[3,1,"מִזְמ֥וֹר לְדָוִ֑ד בְּ֝בָרְח֗וֹ מִפְּנֵ֤י ׀ אַבְשָׁל֬וֹם בְּנוֹ׃"],[3,2,"יְ֭הוָה מָה־רַבּ֣וּ צָרָ֑י רַ֝בִּ֗ים קָמִ֥ים עָלָי׃"],[3,3,"רַבִּים֮ אֹמְרִ֪ים לְנַ֫פְשִׁ֥י אֵ֤ין יְשׁוּעָ֓תָה לּ֬וֹ בֵאלֹהִ֬ים סֶלָה׃"],[3,4,"וְאַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑י כְּ֝בוֹדִ֗י וּמֵרִ֥ים רֹאשִׁי׃"],[3,5,"ק֭וֹלִי אֶל־יְהוָ֣ה אֶקְרָ֑א וַיַּעֲנֵ֨נִי מֵהַ֖ר קָדְשׁ֣וֹ סֶלָה׃"],[3,6,"אֲנִ֥י שָׁכַ֗בְתִּי וָאִ֫ישָׁ֥נָה הֱקִיצ֑וֹתִי כִּ֖י יְהוָ֣ה יִסְמְכֵנִי׃"],[3,7,"לֹא־אִ֭ירָא מֵרִבְב֥וֹת עָ֑ם אֲשֶׁ֥ר סָ֝בִ֗יב שָׁ֣תוּ עָלָי׃"],[3,8,"ק֘וּמָ֤ה יְהוָ֨ה ׀ הוֹשִׁ֘יעֵ֤נִי אֱלֹהַ֗י כִּי־הִכִּ֣יתָ אֶת־כָּל־אֹיְבַ֣י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּרְתָּ׃"],[3,9,"לַיהוָ֥ה הַיְשׁוּעָ֑ה עַל־עַמְּךָ֖ בִרְכָתֶ֣ךָ סֶּלָה׃"]],"p4":[[4,1,"לַמְנַצֵּ֥חַ בִּנְגִינ֗וֹת מִזְמ֥וֹר לְדָוִד׃"],[4,2,"בְּקָרְאִ֡י עֲנֵ֤נִי ׀ אֱלֹ֘הֵ֤י צִדְקִ֗י בַּ֭צָּר הִרְחַ֣בְתָּ לִּ֑י חָ֝נֵּ֗נִי וּשְׁמַ֥ע תְּפִלָּתִי׃"],[4,3,"בְּנֵ֥י אִ֡ישׁ עַד־מֶ֬ה כְבוֹדִ֣י לִ֭כְלִמָּה תֶּאֱהָב֣וּן רִ֑יק תְּבַקְשׁ֖וּ כָזָ֣ב סֶלָה׃"],[4,4,"וּדְע֗וּ כִּי־הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּקָרְאִ֥י אֵלָיו׃"],[4,5,"רִגְז֗וּ וְאַל־תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭לְבַבְכֶם עַל־מִשְׁכַּבְכֶ֗ם וְדֹ֣מּוּ סֶלָה׃"],[4,6,"זִבְח֥וּ זִבְחֵי־צֶ֑דֶק וּ֝בִטְח֗וּ אֶל־יְהוָה׃"],[4,7,"רַבִּ֥ים אֹמְרִים֮ מִי־יַרְאֵ֪נ֫וּ ט֥וֹב נְסָה־עָ֭לֵינוּ א֨וֹר פָּנֶ֬יךָ יְהוָה׃"],[4,8,"נָתַ֣תָּה שִׂמְחָ֣ה בְלִבִּ֑י מֵעֵ֬ת דְּגָנָ֖ם וְתִירוֹשָׁ֣ם רָבּוּ׃"],[4,9,"בְּשָׁל֣וֹם יַחְדָּו֮ אֶשְׁכְּבָ֪ה וְאִ֫ישָׁ֥ן כִּי־אַתָּ֣ה יְהוָ֣ה לְבָדָ֑ד לָ֝בֶ֗טַח תּוֹשִׁיבֵנִי׃"]],"p5":[[5,1,"לַמְנַצֵּ֥חַ אֶל־הַנְּחִיל֗וֹת מִזְמ֥וֹר לְדָוִד׃"],[5,2,"אֲמָרַ֖י הַאֲזִ֥ינָה ׀ יְהוָ֗ה בִּ֣ינָה הֲגִיגִי׃"],[5,3,"הַקְשִׁ֤יבָה ׀ לְק֬וֹל שַׁוְעִ֗י מַלְכִּ֥י וֵאלֹהָ֑י כִּי־אֵ֝לֶ֗יךָ אֶתְפַּלָּל׃"],[5,4,"יְהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑י בֹּ֥קֶר אֶעֱרָךְ־לְ֝ךָ֗ וַאֲצַפֶּה׃"],[5,5,"כִּ֤י ׀ לֹ֤א אֵל־חָפֵ֘ץ רֶ֥שַׁע ׀ אָ֑תָּה לֹ֖א יְגֻרְךָ֣ רָע׃"],[5,6,"לֹא־יִתְיַצְּב֣וּ ה֭וֹלְלִים לְנֶ֣גֶד עֵינֶ֑יךָ שָׂ֝נֵ֗אתָ כָּל־פֹּ֥עֲלֵי אָוֶן׃"],[5,7,"תְּאַבֵּד֮ דֹּבְרֵ֪י כָ֫זָ֥ב אִישׁ־דָּמִ֥ים וּמִרְמָ֗ה יְתָ֘עֵ֥ב ׀ יְהוָה׃"],[5,8,"וַאֲנִ֗י בְּרֹ֣ב חַ֭סְדְּךָ אָב֣וֹא בֵיתֶ֑ךָ אֶשְׁתַּחֲוֶ֥ה אֶל־הֵיכַל־קָ֝דְשְׁךָ֗ בְּיִרְאָתֶךָ׃"],[5,9,"יְהוָ֤ה ׀ נְחֵ֬נִי בְצִדְקָתֶ֗ךָ לְמַ֥עַן שׁוֹרְרָ֑י הַיְשַׁ֖ר לְפָנַ֣י דַּרְכֶּךָ׃"],[5,10,"כִּ֤י אֵ֪ין בְּפִ֡יהוּ נְכוֹנָה֮ קִרְבָּ֪ם הַ֫וּ֥וֹת קֶבֶר־פָּת֥וּחַ גְּרוֹנָ֑ם לְ֝שׁוֹנָ֗ם יַחֲלִיקוּן׃"],[5,11,"הַאֲשִׁימֵ֨ם ׀ אֱלֹהִ֗ים יִפְּלוּ֮ מִמֹּעֲצ֪וֹתֵ֫יהֶ֥ם בְּרֹ֣ב פִּ֭שְׁעֵיהֶם הַדִּיחֵ֑מוֹ כִּי־מָ֥רוּ בָךְ׃"],[5,12,"וְיִשְׂמְח֨וּ כָל־ח֪וֹסֵי בָ֡ךְ לְעוֹלָ֣ם יְ֭רַנֵּנוּ וְתָסֵ֣ךְ עָלֵ֑ימוֹ וְיַעְלְצ֥וּ בְ֝ךָ֗ אֹהֲבֵ֥י שְׁמֶךָ׃"],[5,13,"כִּי־אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶנּוּ׃"]],"p6":[[6,1,"לַמְנַצֵּ֣חַ בִּ֭נְגִינוֹת עַל־הַשְּׁמִינִ֗ית מִזְמ֥וֹר לְדָוִד׃"],[6,2,"יְהוָ֗ה אַל־בְּאַפְּךָ֥ תוֹכִיחֵ֑נִי וְאַל־בַּחֲמָתְךָ֥ תְיַסְּרֵנִי׃"],[6,3,"חָנֵּ֥נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָי׃"],[6,4,"וְ֭נַפְשִׁי נִבְהֲלָ֣ה מְאֹ֑ד וְאַתָּ֥ה יְ֝הוָ֗ה עַד־מָתָי׃"],[6,5,"שׁוּבָ֣ה יְ֭הוָה חַלְּצָ֣ה נַפְשִׁ֑י ה֝וֹשִׁיעֵ֗נִי לְמַ֣עַן חַסְדֶּךָ׃"],[6,6,"כִּ֤י אֵ֣ין בַּמָּ֣וֶת זִכְרֶ֑ךָ בִּ֝שְׁא֗וֹל מִ֣י יוֹדֶה־לָּךְ׃"],[6,7,"יָגַ֤עְתִּי ׀ בְּאַנְחָתִ֗י אַשְׂחֶ֣ה בְכָל־לַ֭יְלָה מִטָּתִ֑י בְּ֝דִמְעָתִ֗י עַרְשִׂ֥י אַמְסֶה׃"],[6,8,"עָשְׁשָׁ֣ה מִכַּ֣עַס עֵינִ֑י עָ֝תְקָ֗ה בְּכָל־צוֹרְרָי׃"],[6,9,"ס֣וּרוּ מִ֭מֶּנִּי כָּל־פֹּ֣עֲלֵי אָ֑וֶן כִּי־שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִי׃"],[6,10,"שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑י יְ֝הוָ֗ה תְּפִלָּתִ֥י יִקָּח׃"],[6,11,"יֵבֹ֤שׁוּ ׀ וְיִבָּהֲל֣וּ מְ֭אֹד כָּל־אֹיְבָ֑י יָ֝שֻׁ֗בוּ יֵבֹ֥שׁוּ רָגַע׃"]],"p7":[[7,1,"שִׁגָּי֗וֹן לְדָ֫וִ֥ד אֲשֶׁר־שָׁ֥ר לַיהוָ֑ה עַל־דִּבְרֵי־כ֝֗וּשׁ בֶּן־יְמִינִי׃"],[7,2,"יְהוָ֣ה אֱ֭לֹהַי בְּךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥נִי מִכָּל־רֹ֝דְפַ֗י וְהַצִּילֵנִי׃"],[7,3,"פֶּן־יִטְרֹ֣ף כְּאַרְיֵ֣ה נַפְשִׁ֑י פֹּ֝רֵ֗ק וְאֵ֣ין מַצִּיל׃"],[7,4,"יְהוָ֣ה אֱ֭לֹהַי אִם־עָשִׂ֣יתִי זֹ֑את אִם־יֶשׁ־עָ֥וֶל בְּכַפָּי׃"],[7,5,"אִם־גָּ֭מַלְתִּי שׁוֹלְמִ֥י רָ֑ע וָאֲחַלְּצָ֖ה צוֹרְרִ֣י רֵיקָם׃"],[7,6,"יִרַדֹּ֥ף אוֹיֵ֨ב ׀ נַפְשִׁ֡י וְיַשֵּׂ֗ג וְיִרְמֹ֣ס לָאָ֣רֶץ חַיָּ֑י וּכְבוֹדִ֓י ׀ לֶעָפָ֖ר יַשְׁכֵּ֣ן סֶלָה׃"],[7,7,"ק֘וּמָ֤ה יְהוָ֨ה ׀ בְּאַפֶּ֗ךָ הִ֭נָּשֵׂא בְּעַבְר֣וֹת צוֹרְרָ֑י וְע֥וּרָה אֵ֝לַ֗י מִשְׁפָּ֥ט צִוִּיתָ׃"],[7,8,"וַעֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑ךָּ וְ֝עָלֶ֗יהָ לַמָּר֥וֹם שׁוּבָה׃"],[7,9,"יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥נִי יְהוָ֑ה כְּצִדְקִ֖י וּכְתֻמִּ֣י עָלָי׃"],[7,10,"יִגְמָר־נָ֬א רַ֨ע ׀ רְשָׁעִים֮ וּתְכוֹנֵ֪ן צַ֫דִּ֥יק וּבֹחֵ֣ן לִ֭בּ֗וֹת וּכְלָי֗וֹת אֱלֹהִ֥ים צַדִּיק׃"],[7,11,"מָגִנִּ֥י עַל־אֱלֹהִ֑ים מ֝וֹשִׁ֗יעַ יִשְׁרֵי־לֵב׃"],[7,12,"אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝אֵ֗ל זֹעֵ֥ם בְּכָל־יוֹם׃"],[7,13,"אִם־לֹ֣א יָ֭שׁוּב חַרְבּ֣וֹ יִלְט֑וֹשׁ קַשְׁתּ֥וֹ דָ֝רַ֗ךְ וַיְכוֹנְנֶהָ׃"],[7,14,"וְ֭לוֹ הֵכִ֣ין כְּלֵי־מָ֑וֶת חִ֝צָּ֗יו לְדֹלְקִ֥ים יִפְעָל׃"],[7,15,"הִנֵּ֥ה יְחַבֶּל־אָ֑וֶן וְהָרָ֥ה עָ֝מָ֗ל וְיָ֣לַד שָׁקֶר׃"],[7,16,"בּ֣וֹר כָּ֭רָה וַיַּחְפְּרֵ֑הוּ וַ֝יִּפֹּ֗ל בְּשַׁ֣חַת יִפְעָל׃"],[7,17,"יָשׁ֣וּב עֲמָל֣וֹ בְרֹאשׁ֑וֹ וְעַ֥ל קָ֝דְקֳד֗וֹ חֲמָס֥וֹ יֵרֵד׃"],[7,18,"אוֹדֶ֣ה יְהוָ֣ה כְּצִדְק֑וֹ וַ֝אֲזַמְּרָ֗ה שֵׁם־יְהוָ֥ה עֶלְיוֹן׃"]],"p8":[[8,1,"לַמְנַצֵּ֥חַ עַל־הַגִּתִּ֗ית מִזְמ֥וֹר לְדָוִד׃"],[8,2,"יְהוָ֤ה אֲדֹנֵ֗ינוּ מָה־אַדִּ֣יר שִׁ֭מְךָ בְּכָל־הָאָ֑רֶץ אֲשֶׁ֥ר תְּנָ֥ה ה֝וֹדְךָ֗ עַל־הַשָּׁמָיִם׃"],[8,3,"מִפִּ֤י עוֹלְלִ֨ים ׀ וְיֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑יךָ לְהַשְׁבִּ֥ית א֝וֹיֵ֗ב וּמִתְנַקֵּם׃"],[8,4,"כִּי־אֶרְאֶ֣ה שָׁ֭מֶיךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑יךָ יָרֵ֥חַ וְ֝כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָנְתָּה׃"],[8,5,"מָה־אֱנ֥וֹשׁ כִּי־תִזְכְּרֶ֑נּוּ וּבֶן־אָ֝דָ֗ם כִּ֣י תִפְקְדֶנּוּ׃"],[8,6,"וַתְּחַסְּרֵ֣הוּ מְּ֭עַט מֵאֱלֹהִ֑ים וְכָב֖וֹד וְהָדָ֣ר תְּעַטְּרֵהוּ׃"],[8,7,"תַּ֭מְשִׁילֵהוּ בְּמַעֲשֵׂ֣י יָדֶ֑יךָ כֹּ֝ל שַׁ֣תָּה תַחַת־רַגְלָיו׃"],[8,8,"צֹנֶ֣ה וַאֲלָפִ֣ים כֻּלָּ֑ם וְ֝גַ֗ם בַּהֲמ֥וֹת שָׂדָי׃"],[8,9,"צִפּ֣וֹר שָׁ֭מַיִם וּדְגֵ֣י הַיָּ֑ם עֹ֝בֵ֗ר אָרְח֥וֹת יַמִּים׃"],[8,10,"יְהוָ֥ה אֲדֹנֵ֑ינוּ מָה־אַדִּ֥יר שִׁ֝מְךָ֗ בְּכָל־הָאָרֶץ׃"]],"p9":[[9,1,"לַ֭מְנַצֵּחַ עַלְמ֥וּת לַבֵּ֗ן מִזְמ֥וֹר לְדָוִד׃"],[9,2,"אוֹדֶ֣ה יְ֭הוָה בְּכָל־לִבִּ֑י אֲ֝סַפְּרָ֗ה כָּל־נִפְלְאוֹתֶיךָ׃"],[9,3,"אֶשְׂמְחָ֣ה וְאֶעֶלְצָ֣ה בָ֑ךְ אֲזַמְּרָ֖ה שִׁמְךָ֣ עֶלְיוֹן׃"],[9,4,"בְּשׁוּב־אוֹיְבַ֥י אָח֑וֹר יִכָּשְׁל֥וּ וְ֝יֹאבְד֗וּ מִפָּנֶיךָ׃"],[9,5,"כִּי־עָ֭שִׂיתָ מִשְׁפָּטִ֣י וְדִינִ֑י יָשַׁ֥בְתָּ לְ֝כִסֵּ֗א שׁוֹפֵ֥ט צֶדֶק׃"],[9,6,"גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע שְׁמָ֥ם מָ֝חִ֗יתָ לְעוֹלָ֥ם וָעֶד׃"],[9,7,"הָאוֹיֵ֨ב ׀ תַּ֥מּוּ חֳרָב֗וֹת לָ֫נֶ֥צַח וְעָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣ם הֵמָּה׃"],[9,8,"וַ֭יהוָה לְעוֹלָ֣ם יֵשֵׁ֑ב כּוֹנֵ֖ן לַמִּשְׁפָּ֣ט כִּסְאוֹ׃"],[9,9,"וְה֗וּא יִשְׁפֹּט־תֵּבֵ֥ל בְּצֶ֑דֶק יָדִ֥ין לְ֝אֻמִּ֗ים בְּמֵישָׁרִים׃"],[9,10,"וִ֘יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַדָּ֑ךְ מִ֝שְׂגָּ֗ב לְעִתּ֥וֹת בַּצָּרָה׃"],[9,11,"וְיִבְטְח֣וּ בְ֭ךָ יוֹדְעֵ֣י שְׁמֶ֑ךָ כִּ֤י לֹא־עָזַ֖בְתָּ דֹרְשֶׁ֣יךָ יְהוָה׃"],[9,12,"זַמְּר֗וּ לַ֭יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝עַמִּ֗ים עֲלִילוֹתָיו׃"],[9,13,"כִּי־דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣ם זָכָ֑ר לֹא־שָׁ֝כַ֗ח צַעֲקַ֥ת עֲנָוִים׃"],[9,14,"חָנְנֵ֬נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִי מִשֹּׂנְאָ֑י מְ֝רוֹמְמִ֗י מִשַּׁ֥עֲרֵי מָוֶת׃"],[9,15,"לְמַ֥עַן אֲסַפְּרָ֗ה כָּל־תְּהִלָּ֫תֶ֥יךָ בְּשַׁעֲרֵ֥י בַת־צִיּ֑וֹן אָ֝גִ֗ילָה בִּישׁוּעָתֶךָ׃"],[9,16,"טָבְע֣וּ ג֭וֹיִם בְּשַׁ֣חַת עָשׂ֑וּ בְּרֶשֶׁת־ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָם׃"],[9,17,"נ֤וֹדַ֨ע ׀ יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּפֹ֣עַל כַּ֭פָּיו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶלָה׃"],[9,18,"יָשׁ֣וּבוּ רְשָׁעִ֣ים לִשְׁא֑וֹלָה כָּל־גּ֝וֹיִ֗ם שְׁכֵחֵ֥י אֱלֹהִים׃"],[9,19,"כִּ֤י לֹ֣א לָ֭נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת עֲ֝נִיִּ֗ים תֹּאבַ֥ד לָעַד׃"],[9,20,"קוּמָ֣ה יְ֭הוָה אַל־יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל־פָּנֶיךָ׃"],[9,21,"שִׁ֘יתָ֤ה יְהוָ֨ה ׀ מוֹרָ֗ה לָ֫הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם אֱנ֖וֹשׁ הֵ֣מָּה סֶּלָה׃"]],"p10":[[10,1,"לָמָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּרָח֑וֹק תַּ֝עְלִ֗ים לְעִתּ֥וֹת בַּצָּרָה׃"],[10,2,"בְּגַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ ׀ בִּמְזִמּ֖וֹת ז֣וּ חָשָׁבוּ׃"],[10,3,"כִּי־הִלֵּ֣ל רָ֭שָׁע עַל־תַּאֲוַ֣ת נַפְשׁ֑וֹ וּבֹצֵ֥עַ בֵּ֝רֵ֗ךְ נִ֘אֵ֥ץ ׀ יְהוָה׃"],[10,4,"רָשָׁ֗ע כְּגֹ֣בַהּ אַ֭פּוֹ בַּל־יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל־מְזִמּוֹתָיו׃"],[10,5,"יָ֘חִ֤ילוּ דְרָכָ֨יו ׀ בְּכָל־עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶיךָ מִנֶּגְדּ֑וֹ כָּל־צ֝וֹרְרָ֗יו יָפִ֥יחַ בָּהֶם׃"],[10,6,"אָמַ֣ר בְּ֭לִבּוֹ בַּל־אֶמּ֑וֹט לְדֹ֥ר וָ֝דֹ֗ר אֲשֶׁ֣ר לֹא־בְרָע׃"],[10,7,"אָלָ֤ה פִּ֣יהוּ מָ֭לֵא וּמִרְמ֣וֹת וָתֹ֑ךְ תַּ֥חַת לְ֝שׁוֹנ֗וֹ עָמָ֥ל וָאָוֶן׃"],[10,8,"יֵשֵׁ֤ב ׀ בְּמַאְרַ֬ב חֲצֵרִ֗ים בַּ֭מִּסְתָּרִים יַהֲרֹ֣ג נָקִ֑י עֵ֝ינָ֗יו לְחֵלְכָ֥ה יִצְפֹּנוּ׃"],[10,9,"יֶאֱרֹ֬ב בַּמִּסְתָּ֨ר ׀ כְּאַרְיֵ֬ה בְסֻכֹּ֗ה יֶ֭אֱרֹב לַחֲט֣וֹף עָנִ֑י יַחְטֹ֥ף עָ֝נִ֗י בְּמָשְׁכ֥וֹ בְרִשְׁתּוֹ׃"],[10,10,"יִדְכֶּ֥ה יָשֹׁ֑חַ וְנָפַ֥ל בַּ֝עֲצוּמָ֗יו חֵ֣יל כָּאִים׃"],[10,11,"אָמַ֣ר בְּ֭לִבּוֹ שָׁ֣כַח אֵ֑ל הִסְתִּ֥יר פָּ֝נָ֗יו בַּל־רָאָ֥ה לָנֶצַח׃"],[10,12,"קוּמָ֤ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑ךָ אַל־תִּשְׁכַּ֥ח עֲנָוִים׃"],[10,13,"עַל־מֶ֤ה ׀ נִאֵ֖ץ רָשָׁ֥ע ׀ אֱלֹהִ֑ים אָמַ֥ר בְּ֝לִבּ֗וֹ לֹ֣א תִּדְרֹשׁ׃"],[10,14,"רָאִ֡תָה כִּי־אַתָּ֤ה ׀ עָ֘מָ֤ל וָכַ֨עַס ׀ תַּבִּיט֮ לָתֵ֪ת בְּיָ֫דֶ֥ךָ עָ֭לֶיךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה ׀ הָיִ֬יתָ עוֹזֵר׃"],[10,15,"שְׁ֭בֹר זְר֣וֹעַ רָשָׁ֑ע וָ֝רָ֗ע תִּדְרוֹשׁ־רִשְׁע֥וֹ בַל־תִּמְצָא׃"],[10,16,"יְהוָ֣ה מֶ֭לֶךְ עוֹלָ֣ם וָעֶ֑ד אָבְד֥וּ ג֝וֹיִ֗ם מֵאַרְצוֹ׃"],[10,17,"תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗ם תַּקְשִׁ֥יב אָזְנֶךָ׃"],[10,18,"לִשְׁפֹּ֥ט יָת֗וֹם וָ֫דָ֥ךְ בַּל־יוֹסִ֥יף ע֑וֹד לַעֲרֹ֥ץ אֱ֝נ֗וֹשׁ מִן־הָאָרֶץ׃"]],"p11":[[11,1,"לַמְנַצֵּ֗חַ לְדָ֫וִ֥ד בַּיהוָ֨ה ׀ חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְנַפְשִׁ֑י נ֝֗וּדִי הַרְכֶ֥ם צִפּוֹר׃"],[11,2,"כִּ֤י הִנֵּ֪ה הָרְשָׁעִ֡ים יִדְרְכ֬וּן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣ם עַל־יֶ֑תֶר לִיר֥וֹת בְּמוֹ־אֹ֝֗פֶל לְיִשְׁרֵי־לֵב׃"],[11,3,"כִּ֣י הַ֭שָּׁתוֹת יֵהָרֵס֑וּן צַ֝דִּ֗יק מַה־פָּעָל׃"],[11,4,"יְהוָ֤ה ׀ בְּהֵ֘יכַ֤ל קָדְשׁ֗וֹ יְהוָה֮ בַּשָּׁמַ֪יִם כִּ֫סְא֥וֹ עֵינָ֥יו יֶחֱז֑וּ עַפְעַפָּ֥יו יִ֝בְחֲנ֗וּ בְּנֵ֣י אָדָם׃"],[11,5,"יְהוָה֮ צַדִּ֪יק יִ֫בְחָ֥ן וְ֭רָשָׁע וְאֹהֵ֣ב חָמָ֑ס שָׂנְאָ֥ה נַפְשׁוֹ׃"],[11,6,"יַמְטֵ֥ר עַל־רְשָׁעִ֗ים פַּ֫חִ֥ים אֵ֣שׁ וְ֭גָפְרִית וְר֥וּחַ זִלְעָפ֗וֹת מְנָ֣ת כּוֹסָם׃"],[11,7,"כִּי־צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵימוֹ׃"]],"p12":[[12,1,"לַמְנַצֵּ֥חַ עַל־הַשְּׁמִינִ֗ית מִזְמ֥וֹר לְדָוִד׃"],[12,2,"הוֹשִׁ֣יעָה יְ֭הוָה כִּי־גָמַ֣ר חָסִ֑יד כִּי־פַ֥סּוּ אֱ֝מוּנִ֗ים מִבְּנֵ֥י אָדָם׃"],[12,3,"שָׁ֤וְא ׀ יְדַבְּרוּ֮ אִ֤ישׁ אֶת־רֵ֫עֵ֥הוּ שְׂפַ֥ת חֲלָק֑וֹת בְּלֵ֖ב וָלֵ֣ב יְדַבֵּרוּ׃"],[12,4,"יַכְרֵ֣ת יְ֭הוָה כָּל־שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלוֹת׃"],[12,5,"אֲשֶׁ֤ר אָמְר֨וּ ׀ לִלְשֹׁנֵ֣נוּ נַ֭גְבִּיר שְׂפָתֵ֣ינוּ אִתָּ֑נוּ מִ֖י אָד֣וֹן לָנוּ׃"],[12,6,"מִשֹּׁ֥ד עֲנִיִּים֮ מֵאַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝יֵ֗שַׁע יָפִ֥יחַ לוֹ׃"],[12,7,"אִמֲר֣וֹת יְהוָה֮ אֲמָר֪וֹת טְהֹ֫ר֥וֹת כֶּ֣סֶף צָ֭רוּף בַּעֲלִ֣יל לָאָ֑רֶץ מְ֝זֻקָּ֗ק שִׁבְעָתָיִם׃"],[12,8,"אַתָּה־יְהוָ֥ה תִּשְׁמְרֵ֑ם תִּצְּרֶ֓נּוּ ׀ מִן־הַדּ֖וֹר ז֣וּ לְעוֹלָם׃"],[12,9,"סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּן כְּרֻ֥ם זֻ֝לּ֗וּת לִבְנֵ֥י אָדָם׃"]],"p13":[[13,1,"לַמְנַצֵּ֗חַ מִזְמ֥וֹר לְדָוִד׃"],[13,2,"עַד־אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣נִי נֶ֑צַח עַד־אָ֓נָה ׀ תַּסְתִּ֖יר אֶת־פָּנֶ֣יךָ מִמֶּנִּי׃"],[13,3,"עַד־אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּנַפְשִׁ֗י יָג֣וֹן בִּלְבָבִ֣י יוֹמָ֑ם עַד־אָ֓נָה ׀ יָר֖וּם אֹיְבִ֣י עָלָי׃"],[13,4,"הַבִּ֣יטָה עֲ֭נֵנִי יְהוָ֣ה אֱלֹהָ֑י הָאִ֥ירָה עֵ֝ינַ֗י פֶּן־אִישַׁ֥ן הַמָּוֶת׃"],[13,5,"פֶּן־יֹאמַ֣ר אֹיְבִ֣י יְכָלְתִּ֑יו צָרַ֥י יָ֝גִ֗ילוּ כִּ֣י אֶמּוֹט׃"],[13,6,"וַאֲנִ֤י ׀ בְּחַסְדְּךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗י בִּישׁוּעָ֫תֶ֥ךָ אָשִׁ֥ירָה לַיהוָ֑ה כִּ֖י גָמַ֣ל עָלָי׃"]],"p14":[[14,1,"לַמְנַצֵּ֗חַ לְדָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭לִבּוֹ אֵ֣ין אֱלֹהִ֑ים הִשְׁחִ֗יתוּ הִתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹשֵׂה־טוֹב׃"],[14,2,"יְהוָ֗ה מִשָּׁמַיִם֮ הִשְׁקִ֪יף עַל־בְּנֵי־אָ֫דָ֥ם לִ֭רְאוֹת הֲיֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵשׁ אֶת־אֱלֹהִים׃"],[14,3,"הַכֹּ֥ל סָר֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹשֵׂה־ט֑וֹב אֵ֝֗ין גַּם־אֶחָד׃"],[14,4,"הֲלֹ֥א יָדְעוּ֮ כָּל־פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּי אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָאוּ׃"],[14,5,"שָׁ֤ם ׀ פָּ֣חֲדוּ פָ֑חַד כִּי־אֱ֝לֹהִ֗ים בְּד֣וֹר צַדִּיק׃"],[14,6,"עֲצַת־עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵהוּ׃"],[14,7,"מִ֥י יִתֵּ֣ן מִצִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּשׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵל׃"]],"p15":[[15,1,"מִזְמ֗וֹר לְדָ֫וִ֥ד יְ֭הֹוָה מִי־יָג֣וּר בְּאָהֳלֶ֑ךָ מִי־יִ֝שְׁכֹּ֗ן בְּהַ֣ר קָדְשֶׁךָ׃"],[15,2,"הוֹלֵ֣ךְ תָּ֭מִים וּפֹעֵ֥ל צֶ֑דֶק וְדֹבֵ֥ר אֱ֝מֶ֗ת בִּלְבָבוֹ׃"],[15,3,"לֹא־רָגַ֨ל ׀ עַל־לְשֹׁנ֗וֹ לֹא־עָשָׂ֣ה לְרֵעֵ֣הוּ רָעָ֑ה וְ֝חֶרְפָּ֗ה לֹא־נָשָׂ֥א עַל־קְרֹבוֹ׃"],[15,4,"נִבְזֶ֤ה ׀ בְּעֵ֘ינָ֤יו נִמְאָ֗ס וְאֶת־יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝הָרַ֗ע וְלֹ֣א יָמִר׃"],[15,5,"כַּסְפּ֤וֹ ׀ לֹא־נָתַ֣ן בְּנֶשֶׁךְ֮ וְשֹׁ֥חַד עַל־נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹשֵׂה־אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְעוֹלָם׃"]],"p16":[[16,1,"מִכְתָּ֥ם לְדָוִ֑ד שָׁמְרֵ֥נִי אֵ֝֗ל כִּי־חָסִ֥יתִי בָךְ׃"],[16,2,"אָמַ֣רְתְּ לַ֭יהוָה אֲדֹנָ֣י אָ֑תָּה ט֝וֹבָתִ֗י בַּל־עָלֶיךָ׃"],[16,3,"לִ֭קְדוֹשִׁים אֲשֶׁר־בָּאָ֣רֶץ הֵ֑מָּה וְ֝אַדִּירֵ֗י כָּל־חֶפְצִי־בָם׃"],[16,4,"יִרְבּ֥וּ עַצְּבוֹתָם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל־אַסִּ֣יךְ נִסְכֵּיהֶ֣ם מִדָּ֑ם וּבַל־אֶשָּׂ֥א אֶת־שְׁ֝מוֹתָ֗ם עַל־שְׂפָתָי׃"],[16,5,"יְהוָ֗ה מְנָת־חֶלְקִ֥י וְכוֹסִ֑י אַ֝תָּ֗ה תּוֹמִ֥יךְ גּוֹרָלִי׃"],[16,6,"חֲבָלִ֣ים נָפְלוּ־לִ֭י בַּנְּעִמִ֑ים אַף־נַ֝חֲלָ֗ת שָׁפְרָ֥ה עָלָי׃"],[16,7,"אֲבָרֵ֗ךְ אֶת־יְ֭הוָה אֲשֶׁ֣ר יְעָצָ֑נִי אַף־לֵ֝יל֗וֹת יִסְּר֥וּנִי כִלְיוֹתָי׃"],[16,8,"שִׁוִּ֬יתִי יְהוָ֣ה לְנֶגְדִּ֣י תָמִ֑יד כִּ֥י מִ֝ימִינִ֗י בַּל־אֶמּוֹט׃"],[16,9,"לָכֵ֤ן ׀ שָׂמַ֣ח לִ֭בִּי וַיָּ֣גֶל כְּבוֹדִ֑י אַף־בְּ֝שָׂרִ֗י יִשְׁכֹּ֥ן לָבֶטַח׃"],[16,10,"כִּ֤י ׀ לֹא־תַעֲזֹ֣ב נַפְשִׁ֣י לִשְׁא֑וֹל לֹא־תִתֵּ֥ן חֲ֝סִידְךָ֗ לִרְא֥וֹת שָׁחַת׃"],[16,11,"תּוֹדִיעֵנִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת־פָּנֶ֑יךָ נְעִמ֖וֹת בִּימִינְךָ֣ נֶצַח׃"]],"p17":[[17,1,"תְּפִלָּ֗ה לְדָ֫וִ֥ד שִׁמְעָ֤ה יְהוָ֨ה ׀ צֶ֗דֶק הַקְשִׁ֥יבָה רִנָּתִ֗י הַאֲזִ֥ינָה תְפִלָּתִ֑י בְּ֝לֹ֗א שִׂפְתֵ֥י מִרְמָה׃"],[17,2,"מִ֭לְּפָנֶיךָ מִשְׁפָּטִ֣י יֵצֵ֑א עֵ֝ינֶ֗יךָ תֶּחֱזֶ֥ינָה מֵישָׁרִים׃"],[17,3,"בָּ֘חַ֤נְתָּ לִבִּ֨י ׀ פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥נִי בַל־תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל־יַעֲבָר־פִּי׃"],[17,4,"לִפְעֻלּ֣וֹת אָ֭דָם בִּדְבַ֣ר שְׂפָתֶ֑יךָ אֲנִ֥י שָׁ֝מַ֗רְתִּי אָרְח֥וֹת פָּרִיץ׃"],[17,5,"תָּמֹ֣ךְ אֲ֭שֻׁרַי בְּמַעְגְּלוֹתֶ֑יךָ בַּל־נָמ֥וֹטּוּ פְעָמָי׃"],[17,6,"אֲנִי־קְרָאתִ֣יךָ כִי־תַעֲנֵ֣נִי אֵ֑ל הַט־אָזְנְךָ֥ לִ֝֗י שְׁמַ֣ע אִמְרָתִי׃"],[17,7,"הַפְלֵ֣ה חֲ֭סָדֶיךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝מִּתְקוֹמְמִ֗ים בִּימִינֶךָ׃"],[17,8,"שָׁ֭מְרֵנִי כְּאִישׁ֣וֹן בַּת־עָ֑יִן בְּצֵ֥ל כְּ֝נָפֶ֗יךָ תַּסְתִּירֵנִי׃"],[17,9,"מִפְּנֵ֣י רְ֭שָׁעִים ז֣וּ שַׁדּ֑וּנִי אֹיְבַ֥י בְּ֝נֶ֗פֶשׁ יַקִּ֥יפוּ עָלָי׃"],[17,10,"חֶלְבָּ֥מוֹ סָּגְר֑וּ פִּ֝֗ימוֹ דִּבְּר֥וּ בְגֵאוּת׃"],[17,11,"אַ֭שֻּׁרֵינוּ עַתָּ֣ה סְבָב֑וּנוּ עֵינֵיהֶ֥ם יָ֝שִׁ֗יתוּ לִנְט֥וֹת בָּאָרֶץ׃"],[17,12,"דִּמְיֹנ֗וֹ כְּ֭אַרְיֵה יִכְס֣וֹף לִטְר֑וֹף וְ֝כִכְפִ֗יר יֹשֵׁ֥ב בְּמִסְתָּרִים׃"],[17,13,"קוּמָ֤ה יְהוָ֗ה קַדְּמָ֣ה פָ֭נָיו הַכְרִיעֵ֑הוּ פַּלְּטָ֥ה נַ֝פְשִׁ֗י מֵרָשָׁ֥ע חַרְבֶּךָ׃"],[17,14,"מִמְתִ֥ים יָדְךָ֨ ׀ יְהוָ֡ה מִמְתִ֬ים מֵחֶ֗לֶד חֶלְקָ֥ם בַּחַיִּים֮ וּצְפוּנְךָ֮ תְּמַלֵּ֪א בִ֫טְנָ֥ם יִשְׂבְּע֥וּ בָנִ֑ים וְהִנִּ֥יחוּ יִ֝תְרָ֗ם לְעוֹלְלֵיהֶם׃"],[17,15,"אֲנִ֗י בְּ֭צֶדֶק אֶחֱזֶ֣ה פָנֶ֑יךָ אֶשְׂבְּעָ֥ה בְ֝הָקִ֗יץ תְּמוּנָתֶךָ׃"]],"p18":[[18,1,"לַמְנַצֵּ֤חַ ׀ לְעֶ֥בֶד יְהוָ֗ה לְדָ֫וִ֥ד אֲשֶׁ֤ר דִּבֶּ֨ר ׀ לַיהוָ֗ה אֶת־דִּ֭בְרֵי הַשִּׁירָ֣ה הַזֹּ֑את בְּי֤וֹם הִצִּיל־יְהוָ֘ה אוֹת֥וֹ מִכַּ֥ף כָּל־אֹ֝יְבָ֗יו וּמִיַּ֥ד שָׁאוּל׃"],[18,2,"וַיֹּאמַ֡ר אֶרְחָמְךָ֖ יְהוָ֣ה חִזְקִי׃"],[18,3,"יְהוָ֤ה ׀ סַלְעִ֥י וּמְצוּדָתִ֗י וּמְפַ֫לְטִ֥י אֵלִ֣י צ֭וּרִי אֶחֱסֶה־בּ֑וֹ מָגִנִּ֥י וְקֶרֶן־יִ֝שְׁעִ֗י מִשְׂגַּבִּי׃"],[18,4,"מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּמִן־אֹ֝יְבַ֗י אִוָּשֵׁעַ׃"],[18,5,"אֲפָפ֥וּנִי חֶבְלֵי־מָ֑וֶת וְנַחֲלֵ֖י בְלִיַּ֣עַל יְבַעֲתוּנִי׃"],[18,6,"חֶבְלֵ֣י שְׁא֣וֹל סְבָב֑וּנִי קִ֝דְּמ֗וּנִי מ֣וֹקְשֵׁי מָוֶת׃"],[18,7,"בַּצַּר־לִ֤י ׀ אֶקְרָ֣א יְהוָה֮ וְאֶל־אֱלֹהַ֪י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵהֵיכָל֣וֹ קוֹלִ֑י וְ֝שַׁוְעָתִ֗י לְפָנָ֤יו ׀ תָּב֬וֹא בְאָזְנָיו׃"],[18,8,"וַתִּגְעַ֬שׁ וַתִּרְעַ֨שׁ ׀ הָאָ֗רֶץ וּמוֹסְדֵ֣י הָרִ֣ים יִרְגָּ֑זוּ וַ֝יִּתְגָּעֲשׁ֗וּ כִּי־חָ֥רָה לוֹ׃"],[18,9,"עָ֘לָ֤ה עָשָׁ֨ן ׀ בְּאַפּ֗וֹ וְאֵשׁ־מִפִּ֥יו תֹּאכֵ֑ל גֶּ֝חָלִ֗ים בָּעֲר֥וּ מִמֶּנּוּ׃"],[18,10,"וַיֵּ֣ט שָׁ֭מַיִם וַיֵּרַ֑ד וַ֝עֲרָפֶ֗ל תַּ֣חַת רַגְלָיו׃"],[18,11,"וַיִּרְכַּ֣ב עַל־כְּ֭רוּב וַיָּעֹ֑ף וַ֝יֵּ֗דֶא עַל־כַּנְפֵי־רוּחַ׃"],[18,12,"יָ֤שֶׁת חֹ֨שֶׁךְ ׀ סִתְר֗וֹ סְבִיבוֹתָ֥יו סֻכָּת֑וֹ חֶשְׁכַת־מַ֝֗יִם עָבֵ֥י שְׁחָקִים׃"],[18,13,"מִנֹּ֗גַהּ נֶ֫גְדּ֥וֹ עָבָ֥יו עָבְר֑וּ בָּ֝רָ֗ד וְגַחֲלֵי־אֵשׁ׃"],[18,14,"וַיַּרְעֵ֬ם בַּשָּׁמַ֨יִם ׀ יְהוָ֗ה וְ֭עֶלְיוֹן יִתֵּ֣ן קֹל֑וֹ בָּ֝רָ֗ד וְגַחֲלֵי־אֵשׁ׃"],[18,15,"וַיִּשְׁלַ֣ח חִ֭צָּיו וַיְפִיצֵ֑ם וּבְרָקִ֥ים רָ֝ב וַיְהֻמֵּם׃"],[18,16,"וַיֵּ֤רָא֨וּ ׀ אֲפִ֥יקֵי מַ֗יִם וַיִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִגַּעֲרָ֣תְךָ֣ יְהוָ֑ה מִ֝נִּשְׁמַ֗ת ר֣וּחַ אַפֶּךָ׃"],[18,17,"יִשְׁלַ֣ח מִ֭מָּרוֹם יִקָּחֵ֑נִי יַ֝מְשֵׁ֗נִי מִמַּ֥יִם רַבִּים׃"],[18,18,"יַצִּילֵ֗נִי מֵאֹיְבִ֥י עָ֑ז וּ֝מִשֹּׂנְאַ֗י כִּי־אָמְצ֥וּ מִמֶּנִּי׃"],[18,19,"יְקַדְּמ֥וּנִי בְיוֹם־אֵידִ֑י וַיְהִי־יְהוָ֖ה לְמִשְׁעָ֣ן לִי׃"],[18,20,"וַיּוֹצִיאֵ֥נִי לַמֶּרְחָ֑ב יְ֝חַלְּצֵ֗נִי כִּ֘י חָ֥פֵץ בִּי׃"],[18,21,"יִגְמְלֵ֣נִי יְהוָ֣ה כְּצִדְקִ֑י כְּבֹ֥ר יָ֝דַ֗י יָשִׁ֥יב לִי׃"],[18,22,"כִּי־שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְלֹא־רָ֝שַׁ֗עְתִּי מֵאֱלֹהָי׃"],[18,23,"כִּ֣י כָל־מִשְׁפָּטָ֣יו לְנֶגְדִּ֑י וְ֝חֻקֹּתָ֗יו לֹא־אָסִ֥יר מֶנִּי׃"],[18,24,"וָאֱהִ֣י תָמִ֣ים עִמּ֑וֹ וָ֝אֶשְׁתַּמֵּ֗ר מֵעֲוֺנִי׃"],[18,25,"וַיָּשֶׁב־יְהוָ֣ה לִ֣י כְצִדְקִ֑י כְּבֹ֥ר יָ֝דַ֗י לְנֶ֣גֶד עֵינָיו׃"],[18,26,"עִם־חָסִ֥יד תִּתְחַסָּ֑ד עִם־גְּבַ֥ר תָּ֝מִ֗ים תִּתַּמָּם׃"],[18,27,"עִם־נָבָ֥ר תִּתְבָּרָ֑ר וְעִם־עִ֝קֵּ֗שׁ תִּתְפַּתָּל׃"],[18,28,"כִּי־אַ֭תָּה עַם־עָנִ֣י תוֹשִׁ֑יעַ וְעֵינַ֖יִם רָמ֣וֹת תַּשְׁפִּיל׃"],[18,29,"כִּי־אַ֭תָּה תָּאִ֣יר נֵרִ֑י יְהוָ֥ה אֱ֝לֹהַ֗י יַגִּ֥יהַּ חָשְׁכִּי׃"],[18,30,"כִּי־בְ֭ךָ אָרֻ֣ץ גְּד֑וּד וּ֝בֵאלֹהַ֗י אֲדַלֶּג־שׁוּר׃"],[18,31,"הָאֵל֮ תָּמִ֪ים דַּ֫רְכּ֥וֹ אִמְרַת־יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְכֹ֤ל ׀ הַחֹסִ֬ים בּוֹ׃"],[18,32,"כִּ֤י מִ֣י אֱ֭לוֹהַּ מִבַּלְעֲדֵ֣י יְהוָ֑ה וּמִ֥י צ֝֗וּר זוּלָתִ֥י אֱלֹהֵינוּ׃"],[18,33,"הָ֭אֵל הַמְאַזְּרֵ֣נִי חָ֑יִל וַיִּתֵּ֖ן תָּמִ֣ים דַּרְכִּי׃"],[18,34,"מְשַׁוֶּ֣ה רַ֭גְלַי כָּאַיָּל֑וֹת וְעַ֥ל בָּ֝מֹתַ֗י יַעֲמִידֵנִי׃"],[18,35,"מְלַמֵּ֣ד יָ֭דַי לַמִּלְחָמָ֑ה וְנִחֲתָ֥ה קֶשֶׁת־נְ֝חוּשָׁ֗ה זְרוֹעֹתָי׃"],[18,36,"וַתִּתֶּן־לִי֮ מָגֵ֪ן יִ֫שְׁעֶ֥ךָ וִימִינְךָ֥ תִסְעָדֵ֑נִי וְעַנְוַתְךָ֥ תַרְבֵּנִי׃"],[18,37,"תַּרְחִ֣יב צַעֲדִ֣י תַחְתָּ֑י וְלֹ֥א מָ֝עֲד֗וּ קַרְסֻלָּי׃"],[18,38,"אֶרְדּ֣וֹף א֭וֹיְבַי וְאַשִּׂיגֵ֑ם וְלֹא־אָ֝שׁוּב עַד־כַּלּוֹתָם׃"],[18,39,"אֶ֭מְחָצֵם וְלֹא־יֻ֣כְלוּ ק֑וּם יִ֝פְּל֗וּ תַּ֣חַת רַגְלָי׃"],[18,40,"וַתְּאַזְּרֵ֣נִי חַ֭יִל לַמִּלְחָמָ֑ה תַּכְרִ֖יעַ קָמַ֣י תַּחְתָּי׃"],[18,41,"וְאֹיְבַ֗י נָתַ֣תָּה לִּ֣י עֹ֑רֶף וּ֝מְשַׂנְאַ֗י אַצְמִיתֵם׃"],[18,42,"יְשַׁוְּע֥וּ וְאֵין־מוֹשִׁ֑יעַ עַל־יְ֝הוָ֗ה וְלֹ֣א עָנָם׃"],[18,43,"וְאֶשְׁחָקֵ֗ם כְּעָפָ֥ר עַל־פְּנֵי־ר֑וּחַ כְּטִ֖יט חוּצ֣וֹת אֲרִיקֵם׃"],[18,44,"תְּפַלְּטֵנִי֮ מֵרִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵנִי לְרֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא־יָדַ֣עְתִּי יַעַבְדוּנִי׃"],[18,45,"לְשֵׁ֣מַע אֹ֭זֶן יִשָּׁ֣מְעוּ לִ֑י בְּנֵי־נֵ֝כָ֗ר יְכַחֲשׁוּ־לִי׃"],[18,46,"בְּנֵי־נֵכָ֥ר יִבֹּ֑לוּ וְ֝יַחְרְג֗וּ מִמִּסְגְּרוֹתֵיהֶם׃"],[18,47,"חַי־יְ֭הוָה וּבָר֣וּךְ צוּרִ֑י וְ֝יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִי׃"],[18,48,"הָאֵ֗ל הַנּוֹתֵ֣ן נְקָמ֣וֹת לִ֑י וַיַּדְבֵּ֖ר עַמִּ֣ים תַּחְתָּי׃"],[18,49,"מְפַלְּטִ֗י מֵאֹ֫יְבָ֥י אַ֣ף מִן־קָ֭מַי תְּרוֹמְמֵ֑נִי מֵאִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵנִי׃"],[18,50,"עַל־כֵּ֤ן ׀ אוֹדְךָ֖ בַגּוֹיִ֥ם ׀ יְהוָ֑ה וּלְשִׁמְךָ֥ אֲזַמֵּרָה׃"],[18,51,"מַגְדִּיל֮ יְשׁוּע֪וֹת מַ֫לְכּ֥וֹ וְעֹ֤שֶׂה חֶ֨סֶד ׀ לִמְשִׁיח֗וֹ לְדָוִ֥ד וּלְזַרְע֗וֹ עַד־עוֹלָם׃"]],"p19":[[19,1,"לַמְנַצֵּ֗חַ מִזְמ֥וֹר לְדָוִד׃"],[19,2,"הַשָּׁמַ֗יִם מְסַפְּרִ֥ים כְּבוֹד־אֵ֑ל וּמַעֲשֵׂ֥ה יָ֝דָ֗יו מַגִּ֥יד הָרָקִיעַ׃"],[19,3,"י֣וֹם לְ֭יוֹם יַבִּ֣יעַ אֹ֑מֶר וְלַ֥יְלָה לְּ֝לַ֗יְלָה יְחַוֶּה־דָּעַת׃"],[19,4,"אֵין־אֹ֭מֶר וְאֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָם׃"],[19,5,"בְּכָל־הָאָ֨רֶץ ׀ יָ֘צָ֤א קַוָּ֗ם וּבִקְצֵ֣ה תֵ֭בֵל מִלֵּיהֶ֑ם לַ֝שֶּׁ֗מֶשׁ שָׂם־אֹ֥הֶל בָּהֶם׃"],[19,6,"וְה֗וּא כְּ֭חָתָן יֹצֵ֣א מֵחֻפָּת֑וֹ יָשִׂ֥ישׂ כְּ֝גִבּ֗וֹר לָר֥וּץ אֹרַח׃"],[19,7,"מִקְצֵ֤ה הַשָּׁמַ֨יִם ׀ מוֹצָא֗וֹ וּתְקוּפָת֥וֹ עַל־קְצוֹתָ֑ם וְאֵ֥ין נִ֝סְתָּ֗ר מֵחַמָּתוֹ׃"],[19,8,"תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּתִי׃"],[19,9,"פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי־לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָיִם׃"],[19,10,"יִרְאַ֤ת יְהוָ֨ה ׀ טְהוֹרָה֮ עוֹמֶ֪דֶת לָ֫עַ֥ד מִשְׁפְּטֵי־יְהוָ֥ה אֱמֶ֑ת צָדְק֥וּ יַחְדָּו׃"],[19,11,"הַנֶּחֱמָדִ֗ים מִ֭זָּהָב וּמִפַּ֣ז רָ֑ב וּמְתוּקִ֥ים מִ֝דְּבַ֗שׁ וְנֹ֣פֶת צוּפִים׃"],[19,12,"גַּם־עַ֭בְדְּךָ נִזְהָ֣ר בָּהֶ֑ם בְּ֝שָׁמְרָ֗ם עֵ֣קֶב רָב׃"],[19,13,"שְׁגִיא֥וֹת מִי־יָבִ֑ין מִנִּסְתָּר֥וֹת נַקֵּנִי׃"],[19,14,"גַּ֤ם מִזֵּדִ֨ים ׀ חֲשֹׂ֬ךְ עַבְדֶּ֗ךָ אַל־יִמְשְׁלוּ־בִ֣י אָ֣ז אֵיתָ֑ם וְ֝נִקֵּ֗יתִי מִפֶּ֥שַׁע רָב׃"],[19,15,"יִהְי֥וּ לְרָצ֨וֹן ׀ אִמְרֵי־פִ֡י וְהֶגְי֣וֹן לִבִּ֣י לְפָנֶ֑יךָ יְ֝הוָ֗ה צוּרִ֥י וְגֹאֲלִי׃"]],"p20":[[20,1,"לַמְנַצֵּ֗חַ מִזְמ֥וֹר לְדָוִד׃"],[20,2,"יַעַנְךָ֣ יְ֭הוָה בְּי֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְךָ֗ שֵׁ֤ם ׀ אֱלֹהֵ֬י יַעֲקֹב׃"],[20,3,"יִשְׁלַח־עֶזְרְךָ֥ מִקֹּ֑דֶשׁ וּ֝מִצִּיּ֗וֹן יִסְעָדֶךָּ׃"],[20,4,"יִזְכֹּ֥ר כָּל־מִנְחֹתֶ֑ךָ וְעוֹלָתְךָ֖ יְדַשְּׁנֶ֣ה סֶלָה׃"],[20,5,"יִתֶּן־לְךָ֥ כִלְבָבֶ֑ךָ וְכָל־עֲצָתְךָ֥ יְמַלֵּא׃"],[20,6,"נְרַנְּנָ֤ה ׀ בִּ֘ישׁ֤וּעָתֶ֗ךָ וּבְשֵׁם־אֱלֹהֵ֥ינוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל־מִשְׁאֲלוֹתֶיךָ׃"],[20,7,"עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ ׀ יְהוָ֗ה מְשִׁ֫יח֥וֹ יַ֭עֲנֵהוּ מִשְּׁמֵ֣י קָדְשׁ֑וֹ בִּ֝גְבֻר֗וֹת יֵ֣שַׁע יְמִינוֹ׃"],[20,8,"אֵ֣לֶּה בָ֭רֶכֶב וְאֵ֣לֶּה בַסּוּסִ֑ים וַאֲנַ֓חְנוּ ׀ בְּשֵׁם־יְהוָ֖ה אֱלֹהֵ֣ינוּ נַזְכִּיר׃"],[20,9,"הֵ֭מָּה כָּרְע֣וּ וְנָפָ֑לוּ וַאֲנַ֥חְנוּ קַּ֝֗מְנוּ וַנִּתְעוֹדָד׃"],[20,10,"יְהוָ֥ה הוֹשִׁ֑יעָה הַ֝מֶּ֗לֶךְ יַעֲנֵ֥נוּ בְיוֹם־קָרְאֵנוּ׃"]],"p21":[[21,1,"לַמְנַצֵּ֗חַ מִזְמ֥וֹר לְדָוִד׃"],[21,2,"יְהוָ֗ה בְּעָזְּךָ֥ יִשְׂמַח־מֶ֑לֶךְ וּ֝בִישׁ֥וּעָתְךָ֗ מַה־יָּ֥גֶל מְאֹד׃"],[21,3,"תַּאֲוַ֣ת לִ֭בּוֹ נָתַ֣תָּה לּ֑וֹ וַאֲרֶ֥שֶׁת שְׂ֝פָתָ֗יו בַּל־מָנַ֥עְתָּ סֶּלָה׃"],[21,4,"כִּי־תְ֭קַדְּמֶנּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝רֹאשׁ֗וֹ עֲטֶ֣רֶת פָּז׃"],[21,5,"חַיִּ֤ים ׀ שָׁאַ֣ל מִ֭מְּךָ נָתַ֣תָּה לּ֑וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָעֶד׃"],[21,6,"גָּד֣וֹל כְּ֭בוֹדוֹ בִּישׁוּעָתֶ֑ךָ ה֥וֹד וְ֝הָדָר תְּשַׁוֶּ֥ה עָלָיו׃"],[21,7,"כִּי־תְשִׁיתֵ֣הוּ בְרָכ֣וֹת לָעַ֑ד תְּחַדֵּ֥הוּ בְ֝שִׂמְחָ֗ה אֶת־פָּנֶיךָ׃"],[21,8,"כִּי־הַ֭מֶּלֶךְ בֹּטֵ֣חַ בַּיהוָ֑ה וּבְחֶ֥סֶד עֶ֝לְי֗וֹן בַּל־יִמּוֹט׃"],[21,9,"תִּמְצָ֣א יָ֭דְךָ לְכָל־אֹיְבֶ֑יךָ יְ֝מִינְךָ תִּמְצָ֥א שֹׂנְאֶיךָ׃"],[21,10,"תְּשִׁיתֵ֤מוֹ ׀ כְּתַנּ֥וּר אֵשׁ֮ לְעֵ֪ת פָּ֫נֶ֥יךָ יְ֭הוָה בְּאַפּ֣וֹ יְבַלְּעֵ֑ם וְתֹאכְלֵ֥ם אֵשׁ׃"],[21,11,"פִּ֭רְיָמוֹ מֵאֶ֣רֶץ תְּאַבֵּ֑ד וְ֝זַרְעָ֗ם מִבְּנֵ֥י אָדָם׃"],[21,12,"כִּי־נָט֣וּ עָלֶ֣יךָ רָעָ֑ה חָשְׁב֥וּ מְ֝זִמָּ֗ה בַּל־יוּכָלוּ׃"],[21,13,"כִּ֭י תְּשִׁיתֵ֣מוֹ שֶׁ֑כֶם בְּ֝מֵיתָרֶ֗יךָ תְּכוֹנֵ֥ן עַל־פְּנֵיהֶם׃"],[21,14,"ר֣וּמָה יְהוָ֣ה בְּעֻזֶּ֑ךָ נָשִׁ֥ירָה וּ֝נְזַמְּרָה גְּבוּרָתֶךָ׃"]],"p22":[[22,1,"לַ֭מְנַצֵּחַ עַל־אַיֶּ֥לֶת הַשַּׁ֗חַר מִזְמ֥וֹר לְדָוִד׃"],[22,2,"אֵלִ֣י אֵ֭לִי לָמָ֣ה עֲזַבְתָּ֑נִי רָח֥וֹק מִ֝ישׁוּעָתִ֗י דִּבְרֵ֥י שַׁאֲגָתִי׃"],[22,3,"אֱלֹהַ֗י אֶקְרָ֣א י֭וֹמָם וְלֹ֣א תַעֲנֶ֑ה וְ֝לַ֗יְלָה וְלֹא־דוּמִיָּ֥ה לִי׃"],[22,4,"וְאַתָּ֥ה קָד֑וֹשׁ י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵל׃"],[22,5,"בְּ֭ךָ בָּטְח֣וּ אֲבֹתֵ֑ינוּ בָּ֝טְח֗וּ וַתְּפַלְּטֵמוֹ׃"],[22,6,"אֵלֶ֣יךָ זָעֲק֣וּ וְנִמְלָ֑טוּ בְּךָ֖ בָטְח֣וּ וְלֹא־בוֹשׁוּ׃"],[22,7,"וְאָנֹכִ֣י תוֹלַ֣עַת וְלֹא־אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּבְז֥וּי עָם׃"],[22,8,"כָּל־רֹ֭אַי יַלְעִ֣גוּ לִ֑י יַפְטִ֥ירוּ בְ֝שָׂפָ֗ה יָנִ֥יעוּ רֹאשׁ׃"],[22,9,"גֹּ֣ל אֶל־יְהוָ֣ה יְפַלְּטֵ֑הוּ יַ֝צִּילֵ֗הוּ כִּ֘י חָ֥פֵץ בּוֹ׃"],[22,10,"כִּי־אַתָּ֣ה גֹחִ֣י מִבָּ֑טֶן מַ֝בְטִיחִ֗י עַל־שְׁדֵ֥י אִמִּי׃"],[22,11,"עָ֭לֶיךָ הָשְׁלַ֣כְתִּי מֵרָ֑חֶם מִבֶּ֥טֶן אִ֝מִּ֗י אֵ֣לִי אָתָּה׃"],[22,12,"אַל־תִּרְחַ֣ק מִ֭מֶּנִּי כִּי־צָרָ֣ה קְרוֹבָ֑ה כִּי־אֵ֥ין עוֹזֵר׃"],[22,13,"סְ֭בָבוּנִי פָּרִ֣ים רַבִּ֑ים אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרוּנִי׃"],[22,14,"פָּצ֣וּ עָלַ֣י פִּיהֶ֑ם אַ֝רְיֵ֗ה טֹרֵ֥ף וְשֹׁאֵג׃"],[22,15,"כַּמַּ֥יִם נִשְׁפַּכְתִּי֮ וְהִתְפָּרְד֗וּ כָּל־עַצְמ֫וֹתָ֥י הָיָ֣ה לִ֭בִּי כַּדּוֹנָ֑ג נָ֝מֵ֗ס בְּת֣וֹךְ מֵעָי׃"],[22,16,"יָ֘בֵ֤שׁ כַּחֶ֨רֶשׂ ׀ כֹּחִ֗י וּ֭לְשׁוֹנִי מֻדְבָּ֣ק מַלְקוֹחָ֑י וְלַעֲפַר־מָ֥וֶת תִּשְׁפְּתֵנִי׃"],[22,17,"כִּ֥י סְבָב֗וּנִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּנִי כָּ֝אֲרִ֗י יָדַ֥י וְרַגְלָי׃"],[22,18,"אֲסַפֵּ֥ר כָּל־עַצְמוֹתָ֑י הֵ֥מָּה יַ֝בִּ֗יטוּ יִרְאוּ־בִי׃"],[22,19,"יְחַלְּק֣וּ בְגָדַ֣י לָהֶ֑ם וְעַל־לְ֝בוּשִׁ֗י יַפִּ֥ילוּ גוֹרָל׃"],[22,20,"וְאַתָּ֣ה יְ֭הוָה אַל־תִּרְחָ֑ק אֱ֝יָלוּתִ֗י לְעֶזְרָ֥תִי חוּשָׁה׃"],[22,21,"הַצִּ֣ילָה מֵחֶ֣רֶב נַפְשִׁ֑י מִיַּד־כֶּ֝֗לֶב יְחִידָתִי׃"],[22,22,"ה֭וֹשִׁיעֵנִי מִפִּ֣י אַרְיֵ֑ה וּמִקַּרְנֵ֖י רֵמִ֣ים עֲנִיתָנִי׃"],[22,23,"אֲסַפְּרָ֣ה שִׁמְךָ֣ לְאֶחָ֑י בְּת֖וֹךְ קָהָ֣ל אֲהַלְלֶךָּ׃"],[22,24,"יִרְאֵ֤י יְהוָ֨ה ׀ הַלְל֗וּהוּ כָּל־זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּהוּ וְג֥וּרוּ מִ֝מֶּ֗נּוּ כָּל־זֶ֥רַע יִשְׂרָאֵל׃"],[22,25,"כִּ֤י לֹא־בָזָ֨ה וְלֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְלֹא־הִסְתִּ֣יר פָּנָ֣יו מִמֶּ֑נּוּ וּבְשַׁוְּע֖וֹ אֵלָ֣יו שָׁמֵעַ׃"],[22,26,"מֵ֥אִתְּךָ֗ תְהִלָּ֫תִ֥י בְּקָהָ֥ל רָ֑ב נְדָרַ֥י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָיו׃"],[22,27,"יֹאכְל֬וּ עֲנָוִ֨ים ׀ וְיִשְׂבָּ֗עוּ יְהַלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑יו יְחִ֖י לְבַבְכֶ֣ם לָעַד׃"],[22,28,"יִזְכְּר֤וּ ׀ וְיָשֻׁ֣בוּ אֶל־יְ֭הוָה כָּל־אַפְסֵי־אָ֑רֶץ וְיִשְׁתַּחֲו֥וּ לְ֝פָנֶ֗יךָ כָּל־מִשְׁפְּח֥וֹת גּוֹיִם׃"],[22,29,"כִּ֣י לַ֭יהוָה הַמְּלוּכָ֑ה וּ֝מֹשֵׁ֗ל בַּגּוֹיִם׃"],[22,30,"אָכְל֬וּ וַיִּשְׁתַּחֲוּ֨וּ ׀ כָּל־דִּשְׁנֵי־אֶ֗רֶץ לְפָנָ֣יו יִ֭כְרְעוּ כָּל־יוֹרְדֵ֣י עָפָ֑ר וְ֝נַפְשׁ֗וֹ לֹ֣א חִיָּה׃"],[22,31,"זֶ֥רַע יַעַבְדֶ֑נּוּ יְסֻפַּ֖ר לַאדֹנָ֣י לַדּוֹר׃"],[22,32,"יָ֭בֹאוּ וְיַגִּ֣ידוּ צִדְקָת֑וֹ לְעַ֥ם נ֝וֹלָ֗ד כִּ֣י עָשָׂה׃"]],"p23":[[23,1,"מִזְמ֥וֹר לְדָוִ֑ד יְהוָ֥ה רֹ֝עִ֗י לֹ֣א אֶחְסָר׃"],[23,2,"בִּנְא֣וֹת דֶּ֭שֶׁא יַרְבִּיצֵ֑נִי עַל־מֵ֖י מְנֻח֣וֹת יְנַהֲלֵנִי׃"],[23,3,"נַפְשִׁ֥י יְשׁוֹבֵ֑ב יַנְחֵ֥נִי בְמַעְגְּלֵי־צֶ֝֗דֶק לְמַ֣עַן שְׁמוֹ׃"],[23,4,"גַּ֤ם כִּי־אֵלֵ֨ךְ בְּגֵ֪יא צַלְמָ֡וֶת לֹא־אִ֘ירָ֤א רָ֗ע כִּי־אַתָּ֥ה עִמָּדִ֑י שִׁבְטְךָ֥ וּ֝מִשְׁעַנְתֶּ֗ךָ הֵ֣מָּה יְנַחֲמֻנִי׃"],[23,5,"תַּעֲרֹ֬ךְ לְפָנַ֨י ׀ שֻׁלְחָ֗ן נֶ֥גֶד צֹרְרָ֑י דִּשַּׁ֖נְתָּ בַשֶּׁ֥מֶן רֹ֝אשִׁ֗י כּוֹסִ֥י רְוָיָה׃"],[23,6,"אַ֤ךְ ׀ ט֤וֹב וָחֶ֣סֶד יִ֭רְדְּפוּנִי כָּל־יְמֵ֣י חַיָּ֑י וְשַׁבְתִּ֥י בְּבֵית־יְ֝הוָ֗ה לְאֹ֣רֶךְ יָמִים׃"]],"p24":[[24,1,"לְדָוִ֗ד מִ֫זְמ֥וֹר לַ֭יהוָה הָאָ֣רֶץ וּמְלוֹאָ֑הּ תֵּ֝בֵ֗ל וְיֹ֣שְׁבֵי בָהּ׃"],[24,2,"כִּי־ה֭וּא עַל־יַמִּ֣ים יְסָדָ֑הּ וְעַל־נְ֝הָר֗וֹת יְכוֹנְנֶהָ׃"],[24,3,"מִי־יַעֲלֶ֥ה בְהַר־יְהוָ֑ה וּמִי־יָ֝קוּם בִּמְק֥וֹם קָדְשׁוֹ׃"],[24,4,"נְקִ֥י כַפַּ֗יִם וּבַר־לֵ֫בָ֥ב אֲשֶׁ֤ר ׀ לֹא־נָשָׂ֣א לַשָּׁ֣וְא נַפְשִׁ֑י וְלֹ֖א נִשְׁבַּ֣ע לְמִרְמָה׃"],[24,5,"יִשָּׂ֣א בְ֭רָכָה מֵאֵ֣ת יְהוָ֑ה וּ֝צְדָקָ֗ה מֵאֱלֹהֵ֥י יִשְׁעוֹ׃"],[24,6,"זֶ֭ה דּ֣וֹר דֹּרְשָׁ֑יו מְבַקְשֵׁ֨י פָנֶ֖יךָ יַעֲקֹ֣ב סֶלָה׃"],[24,7,"שְׂא֤וּ שְׁעָרִ֨ים ׀ רָאשֵׁיכֶ֗ם וְ֭הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝יָב֗וֹא מֶ֣לֶךְ הַכָּבוֹד׃"],[24,8,"מִ֥י זֶה֮ מֶ֤לֶךְ הַכָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְגִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָה׃"],[24,9,"שְׂא֤וּ שְׁעָרִ֨ים ׀ רָאשֵׁיכֶ֗ם וּ֭שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝יָבֹא מֶ֣לֶךְ הַכָּבוֹד׃"],[24,10,"מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַכָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַכָּב֣וֹד סֶלָה׃"]],"p25":[[25,1,"לְדָוִ֡ד אֵלֶ֥יךָ יְ֝הוָ֗ה נַפְשִׁ֥י אֶשָּׂא׃"],[25,2,"אֱלֹהַ֗י בְּךָ֣ בָ֭טַחְתִּי אַל־אֵב֑וֹשָׁה אַל־יַעַלְצ֖וּ אֹיְבַ֣י לִי׃"],[25,3,"גַּ֣ם כָּל־קֹ֭וֶיךָ לֹ֣א יֵבֹ֑שׁוּ יֵ֝בֹ֗שׁוּ הַבּוֹגְדִ֥ים רֵיקָם׃"],[25,4,"דְּרָכֶ֣יךָ יְ֭הוָה הוֹדִיעֵ֑נִי אֹ֖רְחוֹתֶ֣יךָ לַמְּדֵנִי׃"],[25,5,"הַדְרִ֘יכֵ֤נִי בַאֲמִתֶּ֨ךָ ׀ וְלַמְּדֵ֗נִי כִּי־אַ֭תָּה אֱלֹהֵ֣י יִשְׁעִ֑י אוֹתְךָ֥ קִ֝וִּ֗יתִי כָּל־הַיּוֹם׃"],[25,6,"זְכֹר־רַחֲמֶ֣יךָ יְ֭הוָה וַחֲסָדֶ֑יךָ כִּ֖י מֵעוֹלָ֣ם הֵמָּה׃"],[25,7,"חַטֹּ֤אות נְעוּרַ֨י ׀ וּפְשָׁעַ֗י אַל־תִּ֫זְכֹּ֥ר כְּחַסְדְּךָ֥ זְכָר־לִי־אַ֑תָּה לְמַ֖עַן טוּבְךָ֣ יְהוָה׃"],[25,8,"טוֹב־וְיָשָׁ֥ר יְהוָ֑ה עַל־כֵּ֤ן יוֹרֶ֖ה חַטָּאִ֣ים בַּדָּרֶךְ׃"],[25,9,"יַדְרֵ֣ךְ עֲ֭נָוִים בַּמִּשְׁפָּ֑ט וִילַמֵּ֖ד עֲנָוִ֣ים דַּרְכּוֹ׃"],[25,10,"כָּל־אָרְח֣וֹת יְ֭הוָה חֶ֣סֶד וֶאֱמֶ֑ת לְנֹצְרֵ֥י בְ֝רִית֗וֹ וְעֵדֹתָיו׃"],[25,11,"לְמַעַן־שִׁמְךָ֥ יְהוָ֑ה וְסָלַחְתָּ֥ לַ֝עֲוֺנִ֗י כִּ֣י רַב־הוּא׃"],[25,12,"מִי־זֶ֣ה הָ֭אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗נּוּ בְּדֶ֣רֶךְ יִבְחָר׃"],[25,13,"נַ֭פְשׁוֹ בְּט֣וֹב תָּלִ֑ין וְ֝זַרְע֗וֹ יִ֣ירַשׁ אָרֶץ׃"],[25,14,"ס֣וֹד יְ֭הוָה לִירֵאָ֑יו וּ֝בְרִית֗וֹ לְהוֹדִיעָם׃"],[25,15,"עֵינַ֣י תָּ֭מִיד אֶל־יְהוָ֑ה כִּ֤י הוּא־יוֹצִ֖יא מֵרֶ֣שֶׁת רַגְלָי׃"],[25,16,"פְּנֵה־אֵלַ֥י וְחָנֵּ֑נִי כִּי־יָחִ֖יד וְעָנִ֣י אָנִי׃"],[25,17,"צָר֣וֹת לְבָבִ֣י הִרְחִ֑יבוּ מִ֝מְּצוּקוֹתַ֗י הוֹצִיאֵנִי׃"],[25,18,"רְאֵ֣ה עָ֭נְיִי וַעֲמָלִ֑י וְ֝שָׂ֗א לְכָל־חַטֹּאותָי׃"],[25,19,"רְאֵה־אוֹיְבַ֥י כִּי־רָ֑בּוּ וְשִׂנְאַ֖ת חָמָ֣ס שְׂנֵאוּנִי׃"],[25,20,"שָׁמְרָ֣ה נַ֭פְשִׁי וְהַצִּילֵ֑נִי אַל־אֵ֝ב֗וֹשׁ כִּי־חָסִ֥יתִי בָךְ׃"],[25,21,"תֹּם־וָיֹ֥שֶׁר יִצְּר֑וּנִי כִּ֝֗י קִוִּיתִיךָ׃"],[25,22,"פְּדֵ֣ה אֱ֭לֹהִים אֶת־יִשְׂרָאֵ֑ל מִ֝כֹּ֗ל צָרוֹתָיו׃"]],"p26":[[26,1,"לְדָוִ֨ד ׀ שָׁפְטֵ֤נִי יְהוָ֗ה כִּי־אֲ֭נִי בְּתֻמִּ֣י הָלַ֑כְתִּי וּבַיהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָד׃"],[26,2,"בְּחָנֵ֣נִי יְהוָ֣ה וְנַסֵּ֑נִי צָרְפָ֖ה כִלְיוֹתַ֣י וְלִבִּי׃"],[26,3,"כִּי־חַ֭סְדְּךָ לְנֶ֣גֶד עֵינָ֑י וְ֝הִתְהַלַּ֗כְתִּי בַּאֲמִתֶּךָ׃"],[26,4,"לֹא־יָ֭שַׁבְתִּי עִם־מְתֵי־שָׁ֑וְא וְעִ֥ם נַ֝עֲלָמִ֗ים לֹ֣א אָבוֹא׃"],[26,5,"שָׂ֭נֵאתִי קְהַ֣ל מְרֵעִ֑ים וְעִם־רְ֝שָׁעִ֗ים לֹ֣א אֵשֵׁב׃"],[26,6,"אֶרְחַ֣ץ בְּנִקָּי֣וֹן כַּפָּ֑י וַאֲסֹבְבָ֖ה אֶת־מִזְבַּחֲךָ֣ יְהוָה׃"],[26,7,"לַ֭שְׁמִעַ בְּק֣וֹל תּוֹדָ֑ה וּ֝לְסַפֵּ֗ר כָּל־נִפְלְאוֹתֶיךָ׃"],[26,8,"יְהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑ךָ וּ֝מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶךָ׃"],[26,9,"אַל־תֶּאֱסֹ֣ף עִם־חַטָּאִ֣ים נַפְשִׁ֑י וְעִם־אַנְשֵׁ֖י דָמִ֣ים חַיָּי׃"],[26,10,"אֲשֶׁר־בִּידֵיהֶ֥ם זִמָּ֑ה וִ֝ימִינָ֗ם מָ֣לְאָה שֹּׁחַד׃"],[26,11,"וַ֭אֲנִי בְּתֻמִּ֥י אֵלֵ֗ךְ פְּדֵ֣נִי וְחָנֵּנִי׃"],[26,12,"רַ֭גְלִי עָמְדָ֣ה בְמִישׁ֑וֹר בְּ֝מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָה׃"]],"p27":[[27,1,"לְדָוִ֨ד ׀ יְהוָ֤ה ׀ אוֹרִ֣י וְ֭יִשְׁעִי מִמִּ֣י אִירָ֑א יְהוָ֥ה מָעוֹז־חַ֝יַּ֗י מִמִּ֥י אֶפְחָד׃"],[27,2,"בִּקְרֹ֤ב עָלַ֨י ׀ מְרֵעִים֮ לֶאֱכֹ֪ל אֶת־בְּשָׂ֫רִ֥י צָרַ֣י וְאֹיְבַ֣י לִ֑י הֵ֖מָּה כָשְׁל֣וּ וְנָפָלוּ׃"],[27,3,"אִם־תַּחֲנֶ֬ה עָלַ֨י ׀ מַחֲנֶה֮ לֹא־יִירָ֪א לִ֫בִּ֥י אִם־תָּק֣וּם עָ֭לַי מִלְחָמָ֑ה בְּ֝זֹ֗את אֲנִ֣י בוֹטֵחַ׃"],[27,4,"אַחַ֤ת ׀ שָׁאַ֣לְתִּי מֵאֵת־יְהוָה֮ אוֹתָ֪הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣י בְּבֵית־יְ֭הוָה כָּל־יְמֵ֣י חַיַּ֑י לַחֲז֥וֹת בְּנֹעַם־יְ֝הוָ֗ה וּלְבַקֵּ֥ר בְּהֵיכָלוֹ׃"],[27,5,"כִּ֤י יִצְפְּנֵ֨נִי ׀ בְּסֻכֹּה֮ בְּי֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵנִי בְּסֵ֣תֶר אָהֳל֑וֹ בְּ֝צ֗וּר יְרוֹמְמֵנִי׃"],[27,6,"וְעַתָּ֨ה יָר֪וּם רֹאשִׁ֡י עַ֤ל אֹיְבַ֬י סְבִיבוֹתַ֗י וְאֶזְבְּחָ֣ה בְ֭אָהֳלוֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝אֲזַמְּרָ֗ה לַיהוָה׃"],[27,7,"שְׁמַע־יְהוָ֖ה קוֹלִ֥י אֶקְרָ֗א וְחָנֵּ֥נִי וַעֲנֵנִי׃"],[27,8,"לְךָ֤ ׀ אָמַ֣ר לִ֭בִּי בַּקְּשׁ֣וּ פָנָ֑י אֶת־פָּנֶ֖יךָ יְהוָ֣ה אֲבַקֵּשׁ׃"],[27,9,"אַל־תַּסְתֵּ֬ר פָּנֶ֨יךָ ׀ מִמֶּנִּי֮ אַל־תַּט־בְּאַ֗ף עַ֫בְדֶּ֥ךָ עֶזְרָתִ֥י הָיִ֑יתָ אַל־תִּטְּשֵׁ֥נִי וְאַל־תַּ֝עַזְבֵ֗נִי אֱלֹהֵ֥י יִשְׁעִי׃"],[27,10,"כִּי־אָבִ֣י וְאִמִּ֣י עֲזָב֑וּנִי וַיהוָ֣ה יַאַסְפֵנִי׃"],[27,11,"ה֤וֹרֵ֥נִי יְהוָ֗ה דַּ֫רְכֶּ֥ךָ וּ֭נְחֵנִי בְּאֹ֣רַח מִישׁ֑וֹר לְ֝מַ֗עַן שׁוֹרְרָי׃"],[27,12,"אַל־תִּ֭תְּנֵנִי בְּנֶ֣פֶשׁ צָרָ֑י כִּ֥י קָמוּ־בִ֥י עֵדֵי־שֶׁ֝֗קֶר וִיפֵ֥חַ חָמָס׃"],[27,13,"לׅׄוּלֵׅׄ֗אׅׄ הֶ֭אֱמַנְתִּי לִרְא֥וֹת בְּטוּב־יְהוָ֗ה בְּאֶ֣רֶץ חַיִּים׃"],[27,14,"קַוֵּ֗ה אֶל־יְה֫וָ֥ה חֲ֭זַק וְיַאֲמֵ֣ץ לִבֶּ֑ךָ וְ֝קַוֵּ֗ה אֶל־יְהוָה׃"]],"p28":[[28,1,"לְדָוִ֡ד אֵ֘לֶ֤יךָ יְהוָ֨ה ׀ אֶקְרָ֗א צוּרִי֮ אַל־תֶּחֱרַ֪שׁ מִ֫מֶּ֥נִּי פֶּן־תֶּחֱשֶׁ֥ה מִמֶּ֑נִּי וְ֝נִמְשַׁ֗לְתִּי עִם־י֥וֹרְדֵי בוֹר׃"],[28,2,"שְׁמַ֤ע ק֣וֹל תַּ֭חֲנוּנַי בְּשַׁוְּעִ֣י אֵלֶ֑יךָ בְּנָשְׂאִ֥י יָ֝דַ֗י אֶל־דְּבִ֥יר קָדְשֶׁךָ׃"],[28,3,"אַל־תִּמְשְׁכֵ֣נִי עִם־רְשָׁעִים֮ וְעִם־פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם־רֵעֵיהֶ֑ם וְ֝רָעָ֗ה בִּלְבָבָם׃"],[28,4,"תֶּן־לָהֶ֣ם כְּפָעֳלָם֮ וּכְרֹ֪עַ מַעַלְלֵ֫יהֶ֥ם כְּמַעֲשֵׂ֣ה יְ֭דֵיהֶם תֵּ֣ן לָהֶ֑ם הָשֵׁ֖ב גְּמוּלָ֣ם לָהֶם׃"],[28,5,"כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל־פְּעֻלֹּ֣ת יְ֭הוָה וְאֶל־מַעֲשֵׂ֣ה יָדָ֑יו יֶ֝הֶרְסֵ֗ם וְלֹ֣א יִבְנֵם׃"],[28,6,"בָּר֥וּךְ יְהוָ֑ה כִּי־שָׁ֝מַע ק֣וֹל תַּחֲנוּנָי׃"],[28,7,"יְהוָ֤ה ׀ עֻזִּ֥י וּמָגִנִּי֮ בּ֤וֹ בָטַ֥ח לִבִּ֗י וְנֶ֫עֱזָ֥רְתִּי וַיַּעֲלֹ֥ז לִבִּ֑י וּמִשִּׁירִ֥י אֲהוֹדֶנּוּ׃"],[28,8,"יְהוָ֥ה עֹז־לָ֑מוֹ וּמָ֘ע֤וֹז יְשׁוּע֖וֹת מְשִׁיח֣וֹ הוּא׃"],[28,9,"הוֹשִׁ֤יעָה ׀ אֶת־עַמֶּ֗ךָ וּבָרֵ֥ךְ אֶת־נַחֲלָתֶ֑ךָ וּרְעֵ֥ם וְ֝נַשְּׂאֵ֗ם עַד־הָעוֹלָם׃"]],"p29":[[29,1,"מִזְמ֗וֹר לְדָ֫וִ֥ד הָב֣וּ לַ֭יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝יהוָ֗ה כָּב֥וֹד וָעֹז׃"],[29,2,"הָב֣וּ לַ֭יהוָה כְּב֣וֹד שְׁמ֑וֹ הִשְׁתַּחֲו֥וּ לַ֝יהוָ֗ה בְּהַדְרַת־קֹדֶשׁ׃"],[29,3,"ק֥וֹל יְהוָ֗ה עַל־הַ֫מָּ֥יִם אֵל־הַכָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל־מַ֥יִם רַבִּים׃"],[29,4,"קוֹל־יְהוָ֥ה בַּכֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּהָדָר׃"],[29,5,"ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַיְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת־אַרְזֵ֥י הַלְּבָנוֹן׃"],[29,6,"וַיַּרְקִידֵ֥ם כְּמוֹ־עֵ֑גֶל לְבָנ֥וֹן וְ֝שִׂרְיֹ֗ן כְּמ֣וֹ בֶן־רְאֵמִים׃"],[29,7,"קוֹל־יְהוָ֥ה חֹצֵ֗ב לַהֲב֥וֹת אֵשׁ׃"],[29,8,"ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵשׁ׃"],[29,9,"ק֤וֹל יְהוָ֨ה ׀ יְחוֹלֵ֣ל אַיָּלוֹת֮ וַיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת וּבְהֵיכָל֑וֹ כֻּ֝לּ֗וֹ אֹמֵ֥ר כָּבוֹד׃"],[29,10,"יְ֭הוָה לַמַּבּ֣וּל יָשָׁ֑ב וַיֵּ֥שֶׁב יְ֝הוָ֗ה מֶ֣לֶךְ לְעוֹלָם׃"],[29,11,"יְהוָ֗ה עֹ֭ז לְעַמּ֣וֹ יִתֵּ֑ן יְהוָ֓ה ׀ יְבָרֵ֖ךְ אֶת־עַמּ֣וֹ בַשָּׁלוֹם׃"]],"p30":[[30,1,"מִזְמ֡וֹר שִׁיר־חֲנֻכַּ֖ת הַבַּ֣יִת לְדָוִד׃"],[30,2,"אֲרוֹמִמְךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑נִי וְלֹא־שִׂמַּ֖חְתָּ אֹיְבַ֣י לִי׃"],[30,3,"יְהוָ֥ה אֱלֹהָ֑י שִׁוַּ֥עְתִּי אֵ֝לֶ֗יךָ וַתִּרְפָּאֵנִי׃"],[30,4,"יְהוָ֗ה הֶעֱלִ֣יתָ מִן־שְׁא֣וֹל נַפְשִׁ֑י חִ֝יִּיתַ֗נִי מִיָּרְדִי־בוֹר׃"],[30,5,"זַמְּר֣וּ לַיהוָ֣ה חֲסִידָ֑יו וְ֝הוֹד֗וּ לְזֵ֣כֶר קָדְשׁוֹ׃"],[30,6,"כִּ֤י רֶ֨גַע ׀ בְּאַפּוֹ֮ חַיִּ֪ים בִּרְצ֫וֹנ֥וֹ בָּ֭עֶרֶב יָלִ֥ין בֶּ֗כִי וְלַבֹּ֥קֶר רִנָּה׃"],[30,7,"וַ֭אֲנִי אָמַ֣רְתִּי בְשַׁלְוִ֑י בַּל־אֶמּ֥וֹט לְעוֹלָם׃"],[30,8,"יְהוָ֗ה בִּרְצוֹנְךָ֮ הֶעֱמַ֪דְתָּה לְהַרְרִ֫י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗יךָ הָיִ֥יתִי נִבְהָל׃"],[30,9,"אֵלֶ֣יךָ יְהוָ֣ה אֶקְרָ֑א וְאֶל־אֲ֝דֹנָ֗י אֶתְחַנָּן׃"],[30,10,"מַה־בֶּ֥צַע בְּדָמִי֮ בְּרִדְתִּ֪י אֶ֫ל־שָׁ֥חַת הֲיוֹדְךָ֥ עָפָ֑ר הֲיַגִּ֥יד אֲמִתֶּךָ׃"],[30,11,"שְׁמַע־יְהוָ֥ה וְחָנֵּ֑נִי יְ֝הוָה הֱיֵה־עֹזֵ֥ר לִי׃"],[30,12,"הָפַ֣כְתָּ מִסְפְּדִי֮ לְמָח֪וֹל לִ֥י פִּתַּ֥חְתָּ שַׂקִּ֑י וַתְּאַזְּרֵ֥נִי שִׂמְחָה׃"],[30,13,"לְמַ֤עַן ׀ יְזַמֶּרְךָ֣ כָ֭בוֹד וְלֹ֣א יִדֹּ֑ם יְהוָ֥ה אֱ֝לֹהַ֗י לְעוֹלָ֥ם אוֹדֶךָּ׃"]],"p31":[[31,1,"לַמְנַצֵּ֗חַ מִזְמ֥וֹר לְדָוִד׃"],[31,2,"בְּךָ֖ יְהוָ֣ה חָ֭סִיתִי אַל־אֵב֣וֹשָׁה לְעוֹלָ֑ם בְּצִדְקָתְךָ֥ פַלְּטֵנִי׃"],[31,3,"הַטֵּ֤ה אֵלַ֨י ׀ אָזְנְךָ֮ מְהֵרָ֪ה הַצִּ֫ילֵ֥נִי הֱיֵ֤ה לִ֨י ׀ לְצוּר־מָ֭עוֹז לְבֵ֥ית מְצוּד֗וֹת לְהוֹשִׁיעֵנִי׃"],[31,4,"כִּי־סַלְעִ֣י וּמְצוּדָתִ֣י אָ֑תָּה וּלְמַ֥עַן שִׁ֝מְךָ֗ תַּנְחֵ֥נִי וּתְנַהֲלֵנִי׃"],[31,5,"תּוֹצִיאֵ֗נִי מֵרֶ֣שֶׁת ז֭וּ טָ֣מְנוּ לִ֑י כִּי־אַ֝תָּה מָעוּזִּי׃"],[31,6,"בְּיָדְךָ֮ אַפְקִ֪יד ר֫וּחִ֥י פָּדִ֖יתָה אוֹתִ֥י יְהוָ֗ה אֵ֣ל אֱמֶת׃"],[31,7,"שָׂנֵ֗אתִי הַשֹּׁמְרִ֥ים הַבְלֵי־שָׁ֑וְא וַ֝אֲנִ֗י אֶל־יְהוָ֥ה בָּטָחְתִּי׃"],[31,8,"אָגִ֥ילָה וְאֶשְׂמְחָ֗ה בְּחַ֫סְדֶּ֥ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת־עָנְיִ֑י יָ֝דַ֗עְתָּ בְּצָר֥וֹת נַפְשִׁי׃"],[31,9,"וְלֹ֣א הִ֭סְגַּרְתַּנִי בְּיַד־אוֹיֵ֑ב הֶעֱמַ֖דְתָּ בַמֶּרְחָ֣ב רַגְלָי׃"],[31,10,"חָנֵּ֥נִי יְהוָה֮ כִּ֤י צַ֫ר־לִ֥י עָשְׁשָׁ֖ה בְכַ֥עַס עֵינִ֗י נַפְשִׁ֥י וּבִטְנִי׃"],[31,11,"כִּ֤י כָל֪וּ בְיָג֡וֹן חַיַּי֮ וּשְׁנוֹתַ֪י בַּאֲנָ֫חָ֥ה כָּשַׁ֣ל בַּעֲוֺנִ֣י כֹחִ֑י וַעֲצָמַ֥י עָשֵׁשׁוּ׃"],[31,12,"מִכָּל־צֹרְרַ֨י הָיִ֪יתִי חֶרְפָּ֡ה וְלִשֲׁכֵנַ֨י ׀ מְאֹד֮ וּפַ֪חַד לִמְיֻדָּ֫עָ֥י רֹאַ֥י בַּח֑וּץ נָדְד֥וּ מִמֶּנִּי׃"],[31,13,"נִ֭שְׁכַּחְתִּי כְּמֵ֣ת מִלֵּ֑ב הָ֝יִ֗יתִי כִּכְלִ֥י אֹבֵד׃"],[31,14,"כִּ֤י שָׁמַ֨עְתִּי ׀ דִּבַּ֥ת רַבִּים֮ מָג֪וֹר מִסָּ֫בִ֥יב בְּהִוָּסְדָ֣ם יַ֣חַד עָלַ֑י לָקַ֖חַת נַפְשִׁ֣י זָמָמוּ׃"],[31,15,"וַאֲנִ֤י ׀ עָלֶ֣יךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥י אָתָּה׃"],[31,16,"בְּיָדְךָ֥ עִתֹּתָ֑י הַצִּ֘ילֵ֤נִי מִיַּד־א֝וֹיְבַ֗י וּמֵרֹדְפָי׃"],[31,17,"הָאִ֣ירָה פָ֭נֶיךָ עַל־עַבְדֶּ֑ךָ ה֖וֹשִׁיעֵ֣נִי בְחַסְדֶּךָ׃"],[31,18,"יְהוָ֗ה אַל־אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑יךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִשְׁאוֹל׃"],[31,19,"תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַדֹּבְר֖וֹת עַל־צַדִּ֥יק עָתָ֗ק בְּגַאֲוָ֥ה וָבוּז׃"],[31,20,"מָ֤ה רַב־טוּבְךָ֮ אֲשֶׁר־צָפַ֪נְתָּ לִּירֵ֫אֶ֥יךָ פָּ֭עַלְתָּ לַחֹסִ֣ים בָּ֑ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם׃"],[31,21,"תַּסְתִּירֵ֤ם ׀ בְּסֵ֥תֶר פָּנֶיךָ֮ מֵרֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥ם בְּסֻכָּ֗ה מֵרִ֥יב לְשֹׁנוֹת׃"],[31,22,"בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥וֹ לִ֝֗י בְּעִ֣יר מָצוֹר׃"],[31,23,"וַאֲנִ֤י ׀ אָ֘מַ֤רְתִּי בְחָפְזִ֗י נִגְרַזְתִּי֮ מִנֶּ֪גֶד עֵ֫ינֶ֥יךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗י בְּשַׁוְּעִ֥י אֵלֶיךָ׃"],[31,24,"אֶהֱב֥וּ אֶת־יְהוָ֗ה כָּל־חֲסִ֫ידָ֥יו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּמְשַׁלֵּ֥ם עַל־יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָה׃"],[31,25,"חִ֭זְקוּ וְיַאֲמֵ֣ץ לְבַבְכֶ֑ם כָּל־הַ֝מְיַחֲלִ֗ים לַיהוָה׃"]],"p32":[[32,1,"לְדָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְשׂוּי־פֶּ֗שַׁע כְּס֣וּי חֲטָאָה׃"],[32,2,"אַ֥שְׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣וֹ עָוֺ֑ן וְאֵ֖ין בְּרוּח֣וֹ רְמִיָּה׃"],[32,3,"כִּי־הֶ֭חֱרַשְׁתִּי בָּל֣וּ עֲצָמָ֑י בְּ֝שַׁאֲגָתִ֗י כָּל־הַיּוֹם׃"],[32,4,"כִּ֤י ׀ יוֹמָ֣ם וָלַיְלָה֮ תִּכְבַּ֥ד עָלַ֗י יָ֫דֶ֥ךָ נֶהְפַּ֥ךְ לְשַׁדִּ֑י בְּחַרְבֹ֖נֵי קַ֣יִץ סֶלָה׃"],[32,5,"חַטָּאתִ֨י אוֹדִ֪יעֲךָ֡ וַעֲוֺ֘נִ֤י לֹא־כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַי לַיהוָ֑ה וְאַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣י סֶלָה׃"],[32,6,"עַל־זֹ֡את יִתְפַּלֵּ֬ל כָּל־חָסִ֨יד ׀ אֵלֶיךָ֮ לְעֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗יו לֹ֣א יַגִּיעוּ׃"],[32,7,"אַתָּ֤ה ׀ סֵ֥תֶר לִי֮ מִצַּ֪ר תִּ֫צְּרֵ֥נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣נִי סֶלָה׃"],[32,8,"אַשְׂכִּילְךָ֨ ׀ וְאוֹרְךָ֗ בְּדֶרֶךְ־ז֥וּ תֵלֵ֑ךְ אִיעֲצָ֖ה עָלֶ֣יךָ עֵינִי׃"],[32,9,"אַל־תִּהְי֤וּ ׀ כְּס֥וּס כְּפֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּמֶתֶג־וָרֶ֣סֶן עֶדְי֣וֹ לִבְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶיךָ׃"],[32,10,"רַבִּ֥ים מַכְאוֹבִ֗ים לָרָ֫שָׁ֥ע וְהַבּוֹטֵ֥חַ בַּיהוָ֑ה חֶ֝֗סֶד יְסוֹבְבֶנּוּ׃"],[32,11,"שִׂמְח֬וּ בַיהוָ֣ה וְ֭גִילוּ צַדִּיקִ֑ים וְ֝הַרְנִ֗ינוּ כָּל־יִשְׁרֵי־לֵב׃"]],"p33":[[33,1,"רַנְּנ֣וּ צַ֭דִּיקִים בַּיהוָ֑ה לַ֝יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּה׃"],[33,2,"הוֹד֣וּ לַיהוָ֣ה בְּכִנּ֑וֹר בְּנֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ־לוֹ׃"],[33,3,"שִׁירוּ־ל֭וֹ שִׁ֣יר חָדָ֑שׁ הֵיטִ֥יבוּ נַ֝גֵּ֗ן בִּתְרוּעָה׃"],[33,4,"כִּי־יָשָׁ֥ר דְּבַר־יְהוָ֑ה וְכָל־מַ֝עֲשֵׂ֗הוּ בֶּאֱמוּנָה׃"],[33,5,"אֹ֭הֵב צְדָקָ֣ה וּמִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָאָרֶץ׃"],[33,6,"בִּדְבַ֣ר יְ֭הוָה שָׁמַ֣יִם נַעֲשׂ֑וּ וּבְר֥וּחַ פִּ֝֗יו כָּל־צְבָאָם׃"],[33,7,"כֹּנֵ֣ס כַּ֭נֵּד מֵ֣י הַיָּ֑ם נֹתֵ֖ן בְּאֹצָר֣וֹת תְּהוֹמוֹת׃"],[33,8,"יִירְא֣וּ מֵ֭יְהוָה כָּל־הָאָ֑רֶץ מִמֶּ֥נּוּ יָ֝ג֗וּרוּ כָּל־יֹשְׁבֵ֥י תֵבֵל׃"],[33,9,"כִּ֤י ה֣וּא אָמַ֣ר וַיֶּ֑הִי הוּא־צִ֝וָּ֗ה וַיַּעֲמֹד׃"],[33,10,"יְהוָ֗ה הֵפִ֥יר עֲצַת־גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּים׃"],[33,11,"עֲצַ֣ת יְ֭הוָה לְעוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗וֹ לְדֹ֣ר וָדֹר׃"],[33,12,"אַשְׁרֵ֣י הַ֭גּוֹי אֲשֶׁר־יְהוָ֣ה אֱלֹהָ֑יו הָעָ֓ם ׀ בָּחַ֖ר לְנַחֲלָ֣ה לוֹ׃"],[33,13,"מִ֭שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶת־כָּל־בְּנֵ֥י הָאָדָם׃"],[33,14,"מִמְּכוֹן־שִׁבְתּ֥וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל־יֹשְׁבֵ֣י הָאָרֶץ׃"],[33,15,"הַיֹּצֵ֣ר יַ֣חַד לִבָּ֑ם הַ֝מֵּבִ֗ין אֶל־כָּל־מַעֲשֵׂיהֶם׃"],[33,16,"אֵין־הַ֭מֶּלֶךְ נוֹשָׁ֣ע בְּרָב־חָ֑יִל גִּ֝בּ֗וֹר לֹא־יִנָּצֵ֥ל בְּרָב־כֹּחַ׃"],[33,17,"שֶׁ֣קֶר הַ֭סּוּס לִתְשׁוּעָ֑ה וּבְרֹ֥ב חֵ֝יל֗וֹ לֹ֣א יְמַלֵּט׃"],[33,18,"הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל־יְרֵאָ֑יו לַמְיַחֲלִ֥ים לְחַסְדּוֹ׃"],[33,19,"לְהַצִּ֣יל מִמָּ֣וֶת נַפְשָׁ֑ם וּ֝לְחַיּוֹתָ֗ם בָּרָעָב׃"],[33,20,"נַ֭פְשֵׁנוּ חִכְּתָ֣ה לַיהוָ֑ה עֶזְרֵ֖נוּ וּמָגִנֵּ֣נוּ הוּא׃"],[33,21,"כִּי־ב֭וֹ יִשְׂמַ֣ח לִבֵּ֑נוּ כִּ֤י בְשֵׁ֖ם קָדְשׁ֣וֹ בָטָחְנוּ׃"],[33,22,"יְהִי־חַסְדְּךָ֣ יְהוָ֣ה עָלֵ֑ינוּ כַּ֝אֲשֶׁ֗ר יִחַ֥לְנוּ לָךְ׃"]],"p34":[[34,1,"לְדָוִ֗ד בְּשַׁנּוֹת֣וֹ אֶת־טַ֭עְמוֹ לִפְנֵ֣י אֲבִימֶ֑לֶךְ וַ֝יְגָרֲשֵׁ֗הוּ וַיֵּלַךְ׃"],[34,2,"אֲבָרֲכָ֣ה אֶת־יְהוָ֣ה בְּכָל־עֵ֑ת תָּ֝מִ֗יד תְּהִלָּת֥וֹ בְּפִי׃"],[34,3,"בַּ֭יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑י יִשְׁמְע֖וּ עֲנָוִ֣ים וְיִשְׂמָחוּ׃"],[34,4,"גַּדְּל֣וּ לַיהוָ֣ה אִתִּ֑י וּנְרוֹמְמָ֖ה שְׁמ֣וֹ יַחְדָּו׃"],[34,5,"דָּרַ֣שְׁתִּי אֶת־יְהוָ֣ה וְעָנָ֑נִי וּמִכָּל־מְ֝גוּרוֹתַ֗י הִצִּילָנִי׃"],[34,6,"הִבִּ֣יטוּ אֵלָ֣יו וְנָהָ֑רוּ וּ֝פְנֵיהֶ֗ם אַל־יֶחְפָּרוּ׃"],[34,7,"זֶ֤ה עָנִ֣י קָ֭רָא וַיהוָ֣ה שָׁמֵ֑עַ וּמִכָּל־צָ֝רוֹתָ֗יו הוֹשִׁיעוֹ׃"],[34,8,"חֹנֶ֤ה מַלְאַךְ־יְהוָ֓ה סָ֘בִ֤יב לִירֵאָ֗יו וַיְחַלְּצֵם׃"],[34,9,"טַעֲמ֣וּ וּ֭רְאוּ כִּי־ט֣וֹב יְהוָ֑ה אַשְׁרֵ֥י הַ֝גֶּ֗בֶר יֶחֱסֶה־בּוֹ׃"],[34,10,"יְר֣אוּ אֶת־יְהוָ֣ה קְדֹשָׁ֑יו כִּי־אֵ֥ין מַ֝חְס֗וֹר לִירֵאָיו׃"],[34,11,"כְּ֭פִירִים רָשׁ֣וּ וְרָעֵ֑בוּ וְדֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא־יַחְסְר֥וּ כָל־טוֹב׃"],[34,12,"לְכוּ־בָ֭נִים שִׁמְעוּ־לִ֑י יִרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְכֶם׃"],[34,13,"מִי־הָ֭אִישׁ הֶחָפֵ֣ץ חַיִּ֑ים אֹהֵ֥ב יָ֝מִ֗ים לִרְא֥וֹת טוֹב׃"],[34,14,"נְצֹ֣ר לְשׁוֹנְךָ֣ מֵרָ֑ע וּ֝שְׂפָתֶ֗יךָ מִדַּבֵּ֥ר מִרְמָה׃"],[34,15,"ס֣וּר מֵ֭רָע וַעֲשֵׂה־ט֑וֹב בַּקֵּ֖שׁ שָׁל֣וֹם וְרָדְפֵהוּ׃"],[34,16,"עֵינֵ֣י יְ֭הוָה אֶל־צַדִּיקִ֑ים וְ֝אָזְנָ֗יו אֶל־שַׁוְעָתָם׃"],[34,17,"פְּנֵ֣י יְ֭הוָה בְּעֹ֣שֵׂי רָ֑ע לְהַכְרִ֖ית מֵאֶ֣רֶץ זִכְרָם׃"],[34,18,"צָעֲק֣וּ וַיהוָ֣ה שָׁמֵ֑עַ וּמִכָּל־צָ֝רוֹתָ֗ם הִצִּילָם׃"],[34,19,"קָר֣וֹב יְ֭הוָה לְנִשְׁבְּרֵי־לֵ֑ב וְאֶת־דַּכְּאֵי־ר֥וּחַ יוֹשִׁיעַ׃"],[34,20,"רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝מִכֻּלָּ֗ם יַצִּילֶ֥נּוּ יְהוָה׃"],[34,21,"שֹׁמֵ֥ר כָּל־עַצְמוֹתָ֑יו אַחַ֥ת מֵ֝הֵ֗נָּה לֹ֣א נִשְׁבָּרָה׃"],[34,22,"תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה
