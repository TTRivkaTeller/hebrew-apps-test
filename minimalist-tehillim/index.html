ֵּ֑נִי בְּצִדְקָתְךָ֓ ׀ תוֹצִ֖יא מִצָּרָ֣ה נַפְשִׁי׃"],[143,12,"וּבְחַסְדְּךָ֮ תַּצְמִ֪ית אֹ֫יְבָ֥י וְ֭הַאֲבַדְתָּ כָּל־צֹרֲרֵ֣י נַפְשִׁ֑י כִּ֝֗י אֲנִ֣י עַבְדֶּךָ׃"]],"p144":[[144,1,"לְדָוִ֨ד ׀ בָּ֘ר֤וּךְ יְהוָ֨ה ׀ צוּרִ֗י הַמְלַמֵּ֣ד יָדַ֣י לַקְרָ֑ב אֶ֝צְבְּעוֹתַ֗י לַמִּלְחָמָה׃"],[144,2,"חַסְדִּ֥י וּמְצוּדָתִי֮ מִשְׂגַּבִּ֪י וּמְפַלְטִ֫י לִ֥י מָ֭גִנִּי וּב֣וֹ חָסִ֑יתִי הָרוֹדֵ֖ד עַמִּ֣י תַחְתָּי׃"],[144,3,"יְהוָ֗ה מָה־אָ֭דָם וַתֵּדָעֵ֑הוּ בֶּן־אֱ֝נ֗וֹשׁ וַתְּחַשְּׁבֵהוּ׃"],[144,4,"אָ֭דָם לַהֶ֣בֶל דָּמָ֑ה יָ֝מָ֗יו כְּצֵ֣ל עוֹבֵר׃"],[144,5,"יְ֭הוָה הַט־שָׁמֶ֣יךָ וְתֵרֵ֑ד גַּ֖ע בֶּהָרִ֣ים וְיֶעֱשָׁנוּ׃"],[144,6,"בְּר֣וֹק בָּ֭רָק וּתְפִיצֵ֑ם שְׁלַ֥ח חִ֝צֶּ֗יךָ וּתְהֻמֵּם׃"],[144,7,"שְׁלַ֥ח יָדֶ֗יךָ מִמָּ֫ר֥וֹם פְּצֵ֣נִי וְ֭הַצִּילֵנִי מִמַּ֣יִם רַבִּ֑ים מִ֝יַּ֗ד בְּנֵ֣י נֵכָר׃"],[144,8,"אֲשֶׁ֣ר פִּ֭יהֶם דִּבֶּר־שָׁ֑וְא וִ֝ימִינָ֗ם יְמִ֣ין שָׁקֶר׃"],[144,9,"אֱלֹהִ֗ים שִׁ֣יר חָ֭דָשׁ אָשִׁ֣ירָה לָּ֑ךְ בְּנֵ֥בֶל עָ֝שׂ֗וֹר אֲזַמְּרָה־לָּךְ׃"],[144,10,"הַנּוֹתֵ֥ן תְּשׁוּעָ֗ה לַמְּלָ֫כִ֥ים הַ֭פּוֹצֶה אֶת־דָּוִ֥ד עַבְדּ֗וֹ מֵחֶ֥רֶב רָעָה׃"],[144,11,"פְּצֵ֥נִי וְהַצִּילֵנִי֮ מִיַּ֪ד בְּנֵי־נֵ֫כָ֥ר אֲשֶׁ֣ר פִּ֭יהֶם דִּבֶּר־שָׁ֑וְא וִ֝ימִינָ֗ם יְמִ֣ין שָׁקֶר׃"],[144,12,"אֲשֶׁ֤ר בָּנֵ֨ינוּ ׀ כִּנְטִעִים֮ מְגֻדָּלִ֪ים בִּנְעוּרֵ֫יהֶ֥ם בְּנוֹתֵ֥ינוּ כְזָוִיֹּ֑ת מְ֝חֻטָּב֗וֹת תַּבְנִ֥ית הֵיכָל׃"],[144,13,"מְזָוֵ֣ינוּ מְלֵאִים֮ מְפִיקִ֥ים מִזַּ֗ן אֶ֫ל־זַ֥ן צֹאונֵ֣נוּ מַ֭אֲלִיפוֹת מְרֻבָּב֗וֹת בְּחוּצוֹתֵינוּ׃"],[144,14,"אַלּוּפֵ֗ינוּ מְסֻבָּ֫לִ֥ים אֵין־פֶּ֭רֶץ וְאֵ֣ין יוֹצֵ֑את וְאֵ֥ין צְ֝וָחָ֗ה בִּרְחֹבֹתֵינוּ׃"],[144,15,"אַשְׁרֵ֣י הָ֭עָם שֶׁכָּ֣כָה לּ֑וֹ אַשְׁרֵ֥י הָ֝עָ֗ם שֶׁיֲהוָ֥ה אֱלֹהָיו׃"]],"p145":[[145,1,"תְּהִלָּ֗ה לְדָ֫וִ֥ד אֲרוֹמִמְךָ֣ אֱלוֹהַ֣י הַמֶּ֑לֶךְ וַאֲבָרֲכָ֥ה שִׁ֝מְךָ֗ לְעוֹלָ֥ם וָעֶד׃"],[145,2,"בְּכָל־י֥וֹם אֲבָרֲכֶ֑ךָּ וַאֲהַלְלָ֥ה שִׁ֝מְךָ֗ לְעוֹלָ֥ם וָעֶד׃"],[145,3,"גָּ֘ד֤וֹל יְהוָ֣ה וּמְהֻלָּ֣ל מְאֹ֑ד וְ֝לִגְדֻלָּת֗וֹ אֵ֣ין חֵקֶר׃"],[145,4,"דּ֣וֹר לְ֭דוֹר יְשַׁבַּ֣ח מַעֲשֶׂ֑יךָ וּגְב֖וּרֹתֶ֣יךָ יַגִּידוּ׃"],[145,5,"הֲ֭דַר כְּב֣וֹד הוֹדֶ֑ךָ וְדִבְרֵ֖י נִפְלְאוֹתֶ֣יךָ אָשִׂיחָה׃"],[145,6,"וֶעֱז֣וּז נוֹרְאֹתֶ֣יךָ יֹאמֵ֑רוּ וּגְדוּלָּתְךָ֥ אֲסַפְּרֶנָּה׃"],[145,7,"זֵ֣כֶר רַב־טוּבְךָ֣ יַבִּ֑יעוּ וְצִדְקָתְךָ֥ יְרַנֵּנוּ׃"],[145,8,"חַנּ֣וּן וְרַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּגְדָל־חָסֶד׃"],[145,9,"טוֹב־יְהוָ֥ה לַכֹּ֑ל וְ֝רַחֲמָ֗יו עַל־כָּל־מַעֲשָׂיו׃"],[145,10,"יוֹד֣וּךָ יְ֭הוָה כָּל־מַעֲשֶׂ֑יךָ וַ֝חֲסִידֶ֗יךָ יְבָרֲכוּכָה׃"],[145,11,"כְּב֣וֹד מַלְכוּתְךָ֣ יֹאמֵ֑רוּ וּגְבוּרָתְךָ֥ יְדַבֵּרוּ׃"],[145,12,"לְהוֹדִ֤יעַ ׀ לִבְנֵ֣י הָ֭אָדָם גְּבוּרֹתָ֑יו וּ֝כְב֗וֹד הֲדַ֣ר מַלְכוּתוֹ׃"],[145,13,"מַלְכוּתְךָ֗ מַלְכ֥וּת כָּל־עֹלָמִ֑ים וּ֝מֶמְשֶׁלְתְּךָ֗ בְּכָל־דּ֥וֹר וָדוֹר׃"],[145,14,"סוֹמֵ֣ךְ יְ֭הוָה לְכָל־הַנֹּפְלִ֑ים וְ֝זוֹקֵ֗ף לְכָל־הַכְּפוּפִים׃"],[145,15,"עֵינֵי־כֹ֭ל אֵלֶ֣יךָ יְשַׂבֵּ֑רוּ וְאַתָּ֤ה נוֹתֵן־לָהֶ֖ם אֶת־אָכְלָ֣ם בְּעִתּוֹ׃"],[145,16,"פּוֹתֵ֥חַ אֶת־יָדֶ֑ךָ וּמַשְׂבִּ֖יעַ לְכָל־חַ֣י רָצוֹן׃"],[145,17,"צַדִּ֣יק יְ֭הוָה בְּכָל־דְּרָכָ֑יו וְ֝חָסִ֗יד בְּכָל־מַעֲשָׂיו׃"],[145,18,"קָר֣וֹב יְ֭הוָה לְכָל־קֹרְאָ֑יו לְכֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣הוּ בֶאֱמֶת׃"],[145,19,"רְצוֹן־יְרֵאָ֥יו יַעֲשֶׂ֑ה וְאֶת־שַׁוְעָתָ֥ם יִ֝שְׁמַ֗ע וְיוֹשִׁיעֵם׃"],[145,20,"שׁוֹמֵ֣ר יְ֭הוָה אֶת־כָּל־אֹהֲבָ֑יו וְאֵ֖ת כָּל־הָרְשָׁעִ֣ים יַשְׁמִיד׃"],[145,21,"תְּהִלַּ֥ת יְהוָ֗ה יְדַבֶּ֫ר־פִּ֥י וִיבָרֵ֣ךְ כָּל־בָּ֭שָׂר שֵׁ֥ם קָדְשׁ֗וֹ לְעוֹלָ֥ם וָעֶד׃"]],"p146":[[146,1,"הַלְלוּ־יָ֡הּ הַלְלִ֥י נַ֝פְשִׁ֗י אֶת־יְהוָה׃"],[146,2,"אֲהַלְלָ֣ה יְהוָ֣ה בְּחַיָּ֑י אֲזַמְּרָ֖ה לֵאלֹהַ֣י בְּעוֹדִי׃"],[146,3,"אַל־תִּבְטְח֥וּ בִנְדִיבִ֑ים בְּבֶן־אָדָ֓ם ׀ שֶׁ֤אֵין ל֥וֹ תְשׁוּעָה׃"],[146,4,"תֵּצֵ֣א ר֭וּחוֹ יָשֻׁ֣ב לְאַדְמָת֑וֹ בַּיּ֥וֹם הַ֝ה֗וּא אָבְד֥וּ עֶשְׁתֹּנֹתָיו׃"],[146,5,"אַשְׁרֵ֗י שֶׁ֤אֵ֣ל יַעֲקֹ֣ב בְּעֶזְר֑וֹ שִׂ֝בְר֗וֹ עַל־יְהוָ֥ה אֱלֹהָיו׃"],[146,6,"עֹשֶׂ֤ה ׀ שָׁ֘מַ֤יִם וָאָ֗רֶץ אֶת־הַיָּ֥ם וְאֶת־כָּל־אֲשֶׁר־בָּ֑ם הַשֹּׁמֵ֖ר אֱמֶ֣ת לְעוֹלָם׃"],[146,7,"עֹשֶׂ֤ה מִשְׁפָּ֨ט ׀ לָעֲשׁוּקִ֗ים נֹתֵ֣ן לֶ֭חֶם לָרְעֵבִ֑ים יְ֝הוָ֗ה מַתִּ֥יר אֲסוּרִים׃"],[146,8,"יְהוָ֤ה ׀ פֹּ֘קֵ֤חַ עִוְרִ֗ים יְ֭הוָה זֹקֵ֣ף כְּפוּפִ֑ים יְ֝הוָ֗ה אֹהֵ֥ב צַדִּיקִים׃"],[146,9,"יְהוָ֤ה ׀ שֹׁ֘מֵ֤ר אֶת־גֵּרִ֗ים יָת֣וֹם וְאַלְמָנָ֣ה יְעוֹדֵ֑ד וְדֶ֖רֶךְ רְשָׁעִ֣ים יְעַוֵּת׃"],[146,10,"יִמְלֹ֤ךְ יְהוָ֨ה ׀ לְעוֹלָ֗ם אֱלֹהַ֣יִךְ צִ֭יּוֹן לְדֹ֥ר וָדֹ֗ר הַלְלוּ־יָהּ׃"]],"p147":[[147,1,"הַ֥לְלוּ יָ֨הּ ׀ כִּי־ט֭וֹב זַמְּרָ֣ה אֱלֹהֵ֑ינוּ כִּי־נָ֝עִים נָאוָ֥ה תְהִלָּה׃"],[147,2,"בּוֹנֵ֣ה יְרוּשָׁלִַ֣ם יְהוָ֑ה נִדְחֵ֖י יִשְׂרָאֵ֣ל יְכַנֵּס׃"],[147,3,"הָ֭רֹפֵא לִשְׁב֣וּרֵי לֵ֑ב וּ֝מְחַבֵּ֗שׁ לְעַצְּבוֹתָם׃"],[147,4,"מוֹנֶ֣ה מִ֭סְפָּר לַכּוֹכָבִ֑ים לְ֝כֻלָּ֗ם שֵׁמ֥וֹת יִקְרָא׃"],[147,5,"גָּד֣וֹל אֲדוֹנֵ֣ינוּ וְרַב־כֹּ֑חַ לִ֝תְבוּנָת֗וֹ אֵ֣ין מִסְפָּר׃"],[147,6,"מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי־אָרֶץ׃"],[147,7,"עֱנ֣וּ לַיהוָ֣ה בְּתוֹדָ֑ה זַמְּר֖וּ לֵאלֹהֵ֣ינוּ בְכִנּוֹר׃"],[147,8,"הַמְכַסֶּ֬ה שָׁמַ֨יִם ׀ בְּעָבִ֗ים הַמֵּכִ֣ין לָאָ֣רֶץ מָטָ֑ר הַמַּצְמִ֖יחַ הָרִ֣ים חָצִיר׃"],[147,9,"נוֹתֵ֣ן לִבְהֵמָ֣ה לַחְמָ֑הּ לִבְנֵ֥י עֹ֝רֵ֗ב אֲשֶׁ֣ר יִקְרָאוּ׃"],[147,10,"לֹ֤א בִגְבוּרַ֣ת הַסּ֣וּס יֶחְפָּ֑ץ לֹא־בְשׁוֹקֵ֖י הָאִ֣ישׁ יִרְצֶה׃"],[147,11,"רוֹצֶ֣ה יְ֭הוָה אֶת־יְרֵאָ֑יו אֶת־הַמְיַחֲלִ֥ים לְחַסְדּוֹ׃"],[147,12,"שַׁבְּחִ֣י יְ֭רוּשָׁלִַם אֶת־יְהוָ֑ה הַלְלִ֖י אֱלֹהַ֣יִךְ צִיּוֹן׃"],[147,13,"כִּי־חִ֭זַּק בְּרִיחֵ֣י שְׁעָרָ֑יִךְ בֵּרַ֖ךְ בָּנַ֣יִךְ בְּקִרְבֵּךְ׃"],[147,14,"הַשָּׂם־גְּבוּלֵ֥ךְ שָׁל֑וֹם חֵ֥לֶב חִ֝טִּ֗ים יַשְׂבִּיעֵךְ׃"],[147,15,"הַשֹּׁלֵ֣חַ אִמְרָת֣וֹ אָ֑רֶץ עַד־מְ֝הֵרָ֗ה יָר֥וּץ דְּבָרוֹ׃"],[147,16,"הַנֹּתֵ֣ן שֶׁ֣לֶג כַּצָּ֑מֶר כְּ֝פ֗וֹר כָּאֵ֥פֶר יְפַזֵּר׃"],[147,17,"מַשְׁלִ֣יךְ קַרְח֣וֹ כְפִתִּ֑ים לִפְנֵ֥י קָ֝רָת֗וֹ מִ֣י יַעֲמֹד׃"],[147,18,"יִשְׁלַ֣ח דְּבָר֣וֹ וְיַמְסֵ֑ם יַשֵּׁ֥ב ר֝וּח֗וֹ יִזְּלוּ־מָיִם׃"],[147,19,"מַגִּ֣יד דְּבָרָ֣יו לְיַעֲקֹ֑ב חֻקָּ֥יו וּ֝מִשְׁפָּטָ֗יו לְיִשְׂרָאֵל׃"],[147,20,"לֹ֘א עָ֤שָׂה כֵ֨ן ׀ לְכָל־גּ֗וֹי וּמִשְׁפָּטִ֥ים בַּל־יְדָע֗וּם הַלְלוּ־יָהּ׃"]],"p148":[[148,1,"הַ֥לְלוּ יָ֨הּ ׀ הַלְל֣וּ אֶת־יְ֭הוָה מִן־הַשָּׁמַ֑יִם הַ֝לְל֗וּהוּ בַּמְּרוֹמִים׃"],[148,2,"הַלְל֥וּהוּ כָל־מַלְאָכָ֑יו הַ֝לְל֗וּהוּ כָּל־צְבָאָיו׃"],[148,3,"הַ֭לְלוּהוּ שֶׁ֣מֶשׁ וְיָרֵ֑חַ הַ֝לְל֗וּהוּ כָּל־כּ֥וֹכְבֵי אוֹר׃"],[148,4,"הַ֭לְלוּהוּ שְׁמֵ֣י הַשָּׁמָ֑יִם וְ֝הַמַּ֗יִם אֲשֶׁ֤ר ׀ מֵעַ֬ל הַשָּׁמָיִם׃"],[148,5,"יְ֭הַלְלוּ אֶת־שֵׁ֣ם יְהוָ֑ה כִּ֤י ה֭וּא צִוָּ֣ה וְנִבְרָאוּ׃"],[148,6,"וַיַּעֲמִידֵ֣ם לָעַ֣ד לְעוֹלָ֑ם חָק־נָ֝תַ֗ן וְלֹ֣א יַעֲבוֹר׃"],[148,7,"הַלְל֣וּ אֶת־יְ֭הוָה מִן־הָאָ֑רֶץ תַּ֝נִּינִ֗ים וְכָל־תְּהֹמוֹת׃"],[148,8,"אֵ֣שׁ וּ֭בָרָד שֶׁ֣לֶג וְקִיט֑וֹר ר֥וּחַ סְ֝עָרָ֗ה עֹשָׂ֥ה דְבָרוֹ׃"],[148,9,"הֶהָרִ֥ים וְכָל־גְּבָע֑וֹת עֵ֥ץ פְּ֝רִ֗י וְכָל־אֲרָזִים׃"],[148,10,"הַחַיָּ֥ה וְכָל־בְּהֵמָ֑ה רֶ֝֗מֶשׂ וְצִפּ֥וֹר כָּנָף׃"],[148,11,"מַלְכֵי־אֶ֭רֶץ וְכָל־לְאֻמִּ֑ים שָׂ֝רִ֗ים וְכָל־שֹׁ֥פְטֵי אָרֶץ׃"],[148,12,"בַּחוּרִ֥ים וְגַם־בְּתוּל֑וֹת זְ֝קֵנִ֗ים עִם־נְעָרִים׃"],[148,13,"יְהַלְל֤וּ ׀ אֶת־שֵׁ֬ם יְהוָ֗ה כִּי־נִשְׂגָּ֣ב שְׁמ֣וֹ לְבַדּ֑וֹ ה֝וֹד֗וֹ עַל־אֶ֥רֶץ וְשָׁמָיִם׃"],[148,14,"וַיָּ֤רֶם קֶ֨רֶן ׀ לְעַמּ֡וֹ תְּהִלָּ֤ה לְכָל־חֲסִידָ֗יו לִבְנֵ֣י יִ֭שְׂרָאֵל עַם־קְרֹב֗וֹ הַלְלוּ־יָהּ׃"]],"p149":[[149,1,"הַ֥לְלוּ יָ֨הּ ׀ שִׁ֣ירוּ לַ֭יהוָה שִׁ֣יר חָדָ֑שׁ תְּ֝הִלָּת֗וֹ בִּקְהַ֥ל חֲסִידִים׃"],[149,2,"יִשְׂמַ֣ח יִשְׂרָאֵ֣ל בְּעֹשָׂ֑יו בְּנֵי־צִ֝יּ֗וֹן יָגִ֥ילוּ בְמַלְכָּם׃"],[149,3,"יְהַלְל֣וּ שְׁמ֣וֹ בְמָח֑וֹל בְּתֹ֥ף וְ֝כִנּ֗וֹר יְזַמְּרוּ־לוֹ׃"],[149,4,"כִּי־רוֹצֶ֣ה יְהוָ֣ה בְּעַמּ֑וֹ יְפָאֵ֥ר עֲ֝נָוִ֗ים בִּישׁוּעָה׃"],[149,5,"יַעְלְז֣וּ חֲסִידִ֣ים בְּכָב֑וֹד יְ֝רַנְּנ֗וּ עַל־מִשְׁכְּבוֹתָם׃"],[149,6,"רוֹמְמ֣וֹת אֵ֭ל בִּגְרוֹנָ֑ם וְחֶ֖רֶב פִּיפִיּ֣וֹת בְּיָדָם׃"],[149,7,"לַעֲשׂ֣וֹת נְ֭קָמָה בַּגּוֹיִ֑ם תּ֝וֹכֵחֹ֗ת בַּל־אֻמִּים׃"],[149,8,"לֶאְסֹ֣ר מַלְכֵיהֶ֣ם בְּזִקִּ֑ים וְ֝נִכְבְּדֵיהֶ֗ם בְּכַבְלֵ֥י בַרְזֶל׃"],[149,9,"לַעֲשׂ֤וֹת בָּהֶ֨ם ׀ מִשְׁפָּ֬ט כָּת֗וּב הָדָ֣ר ה֭וּא לְכָל־חֲסִידָ֗יו הַלְלוּ־יָהּ׃"]],"p150":[[150,1,"הַ֥לְלוּ יָ֨הּ ׀ הַלְלוּ־אֵ֥ל בְּקָדְשׁ֑וֹ הַ֝לְל֗וּהוּ בִּרְקִ֥יעַ עֻזּוֹ׃"],[150,2,"הַלְל֥וּהוּ בִגְבוּרֹתָ֑יו הַ֝לְל֗וּהוּ כְּרֹ֣ב גֻּדְלוֹ׃"],[150,3,"הַ֭לְלוּהוּ בְּתֵ֣קַע שׁוֹפָ֑ר הַ֝לְל֗וּהוּ בְּנֵ֣בֶל וְכִנּוֹר׃"],[150,4,"הַ֭לְלוּהוּ בְתֹ֣ף וּמָח֑וֹל הַ֝לְל֗וּהוּ בְּמִנִּ֥ים וְעוּגָב׃"],[150,5,"הַלְל֥וּהוּ בְצִלְצְלֵי־שָׁ֑מַע הַ֝לְל֗וּהוּ בְּצִלְצְלֵ֥י תְרוּעָה׃"],[150,6,"כֹּ֣ל הַ֭נְּשָׁמָה תְּהַלֵּ֥ל יָ֗הּ הַלְלוּ־יָהּ׃"]]};</script>

function buildVerse(pv){     /* verse text with its written/read words marked; returns a fragment, or null when there are none */

  var raw = pv[2], cur = 0, frag = document.createDocumentFragment(), wr = kqWritten(), any = false;
  pairs.forEach(function(pr){
    var i = raw.indexOf(pr[0], cur); if (i < 0) return;
    if (i > cur) frag.appendChild(document.createTextNode(fmtSeg(raw.slice(cur, i))));

/* ---------- storage ---------- */
function save(){
  try{
    var d = {}; for (var k in done) if (done[k].size) d[k] = Array.from(done[k]);
    localStorage.setItem(KEY, JSON.stringify({slug:state.slug, main:state.main, a:state.a, verse:state.verse, done:d, settings:settings}));
  }catch(e){}
}
function readSettings(s){
  if (!s) return;
  if (MODES.indexOf(s.mode) > -1) settings.mode = s.mode;
  if (FONTS.indexOf(s.font) > -1) settings.font = s.font;
  if (typeof s.size === 'number') settings.size = Math.min(64, Math.max(26, s.size));
  if (['auto','light','dark'].indexOf(s.theme) > -1) settings.theme = s.theme;
  if (typeof s.wake === 'boolean') settings.wake = s.wake;
  if (s.lang === 'en' || s.lang === 'he') settings.lang = s.lang;
  if (typeof s.kq === 'boolean') settings.kq = s.kq;
  if (ACCENTS[s.accent]) settings.accent = s.accent;
  if (s.where === 'il' || s.where === 'dia') settings.where = s.where;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if (raw){
      var o = JSON.parse(raw);
      readSettings(o.settings);
      if (!PRACTICE && o.done && typeof o.done === 'object') Object.keys(o.done).forEach(function(slug){
        var p = BY[slug]; if (!p || !Array.isArray(o.done[slug])) return;
        o.done[slug].forEach(function(i){ if (Number.isInteger(i) && i >= 0 && i < p.aliyot.length) dset(slug).add(i); });
      });
      if (BY[o.slug]){
        var p2 = BY[o.slug]; state.slug = o.slug;
        state.main = p2.aux ? (BY[o.main] && !BY[o.main].aux ? o.main : MAIN[0]) : o.slug;
        if (Number.isInteger(o.a) && o.a >= 0 && o.a < p2.aliyot.length){
          state.a = o.a;
          if (Number.isInteger(o.verse) && o.verse >= 0 && o.verse < p2.aliyot[o.a].c) state.verse = o.verse;

      return true;

  else if (PRACTICE){
    if (state.a < curP().aliyot.length - 1){ state.a++; state.verse = 0; moveDir = 1; save(); render(true); }

function nextUndoneUnit(slug){

  } else {

var pend = new Map(), selecting = false;   /* pending changes while editing: slug -> wanted done state */
